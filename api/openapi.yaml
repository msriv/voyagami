                $ref: "#/components/schemas/Poll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/polls/{pollId}/vote:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: pollId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: votePoll
      tags: [polls]
      summary: Vote, or change your vote
      description: |
        One vote per member, replaced each time, until the poll closes. Every
        active member can vote, viewers included. Send one option, or several
        when the poll allows many.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVote"
      responses:
        "200":
          description: The poll with updated counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/polls/{pollId}/close:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: pollId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closePoll
      tags: [polls]
      summary: Close a poll
      description: |
        Owners and editors. The option with most votes wins. With no votes or
        a tie the answer is 409 and the closer picks one with `optionId`
        (decided by the owner). `addToDate` puts the winner on that day of the
        itinerary when it is a place. Closing a closed poll returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollClose"
      responses:
        "200":
          description: The closed poll, and the stop if one was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollClosed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/meet-points:
