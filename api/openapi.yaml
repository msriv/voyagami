        at:
          type: string
          format: date-time
          description: When to meet. Absent means no time yet.
    MeetPointUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        place:
          $ref: "#/components/schemas/PlaceRef"
        at:
          type: string
          format: date-time
    MeetPoint:
