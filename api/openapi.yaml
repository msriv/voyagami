          type: string
    put:
      operationId: setDayOrder
      tags: [stops]
      summary: Set the order of a day's stops
      description: |
        Owners and editors only. `stopIds` must list every stop on the day
        exactly once. Used to accept a suggestion, and to undo it by sending
        the earlier order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayOrder"
      responses:
        "200":
          description: The day's stops in the new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a one-time code to a phone
      description: |
        Sends a six-digit code by SMS. The answer is the same whether or not
        the number already has an account. In dev the code is always `123456`
        and nothing is sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "204":
          description: A code was sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Check a one-time code and sign in
      description: |
        Creates the account the first time a number is verified. Returns a
        short-lived access token and a refresh token. A wrong code answers 400
        with code `invalid_code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Swap a refresh token for a new token pair
      description: |
        Each refresh token works once. Sending one that was already used ends
        the session, so a stolen token cannot be used quietly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: End this device's session
      description: |
        Revokes the refresh token for the session. The access token keeps
        working until it expires, at most 15 minutes.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued after phone sign-in.
  responses:
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request could not be read or a field is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts for this phone number. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The service cannot do this right now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The person is on the trip but their role does not allow this, or (code
        `limit_reached`, with `feature`) the plan limit does.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request is fine but cannot be done in the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such trip, or the person is not a member of it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Phone number in E.164 form, for example `+14155550123`.
          examples: ["+14155550123"]
    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: Phone number in E.164 form.
        code:
          type: string
          description: The one-time code.
        region:
          type: string
          description: Device region (ISO 3166-1 alpha-2). Only used when the account is created, until onboarding confirms it.
          pattern: "^[A-Za-z]{2}$"
        language:
          type: string
          description: Device language (BCP 47). Only used when the account is created.
          maxLength: 35
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    SessionTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, userId, isNewUser]
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        refreshToken:
          type: string
          description: Keep in secure storage. Works once.
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
        userId:
          type: string
        isNewUser:
          type: boolean
          description: True when this sign-in created the account. Always false on refresh.
    Me:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Stable account ID. Not the phone number.
        displayName:
          type: string
          description: Name the person chose, if any.
        travelStyle:
          $ref: "#/components/schemas/TravelStyle"
        notifications:
          type: object
          description: >-
            Push settings. Keys are `all` and the event kinds memberJoined,
            stopAdded, pollCreated, expenseAdded and meetPoint. A missing key
            means on. `all: false` mutes everything.
          additionalProperties:
            type: boolean
        homeRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the person's home country.
        homeCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Used for display and as a default for new trips.
        units:
          $ref: "#/components/schemas/Units"
        regionSource:
          type: string
          enum: [device, confirmed]
          description: "`device` when guessed from the phone, `confirmed` once the person chose."
    EntitlementDecision:
      type: object
      required: [allowed, limit, used, needsPlus, readOnly]
      properties:
        allowed:
          type: boolean
          description: Whether one more may be added, or the feature used.
        limit:
          type: integer
          description: The cap. -1 means no cap. For an on/off feature, 0 means Plus only.
        used:
          type: integer
        needsPlus:
          type: boolean
          description: True when the answer is no and Plus or a Trip Pass would change it.
        readOnly:
          type: boolean
          description: True when existing content is over the cap (after a downgrade). It is kept and can be read, but not changed.
    Entitlements:
      type: object
      required: [plan, features]
      properties:
        plan:
          type: string
          enum: [free, plus, pass]
          description: "`pass` only when asked about a trip that has a Trip Pass."
        features:
          type: object
          description: One decision per feature, keyed by feature name.
          additionalProperties:
            $ref: "#/components/schemas/EntitlementDecision"
        pass:
          $ref: "#/components/schemas/PassInfo"
        subscription:
          $ref: "#/components/schemas/SubscriptionInfo"
    SubscriptionInfo:
      type: object
      description: |
        How the signed-in person's own Plus is running. Left out on Free, and when
        Plus comes only from a crew member or a Trip Pass. The Manage subscription
        screen uses it.
      required: [state, willRenew, billingIssue]
      properties:
        state:
          type: string
          enum: [subscribed, trial]
        endsAt:
          type: string
          format: date-time
          description: When it renews (willRenew is true) or ends (false), or when the trial ends. Left out when the store has not said.
        willRenew:
          type: boolean
          description: False after the person turned renewal off. Plus still works until endsAt. Always false for a trial.
        billingIssue:
          type: boolean
          description: True when the store could not take payment. Tell the person to fix their payment method.
        productId:
          type: string
          description: The store product, for example to say monthly or yearly.
    PassInfo:
      type: object
      description: |
        The trip's Trip Pass. Only on the trip's entitlements, and only while the
        trip has a pass that was not refunded and has not ended. It covers the
        whole crew, whoever bought it.
      required: [boughtBy]
      properties:
        boughtBy:
          type: string
          description: The id of the member who bought it. Look the name up in the crew.
        endsOn:
          type: string
          description: The last day the pass works, YYYY-MM-DD. Left out when the trip has no end date, so the pass has no end yet.
    ConsentState:
      type: string
      enum: [unset, granted, denied]
    Consents:
      type: object
      required: [location, notifications, photos, analytics]
      properties:
        location:
          $ref: "#/components/schemas/ConsentState"
        notifications:
          $ref: "#/components/schemas/ConsentState"
        photos:
          $ref: "#/components/schemas/ConsentState"
        analytics:
          $ref: "#/components/schemas/ConsentState"
        updatedAt:
          type: string
          format: date-time
    ConsentsUpdate:
      type: object
      description: Only the purposes that are sent change. `unset` cannot be sent.
      properties:
        location:
          type: string
          enum: [granted, denied]
        notifications:
          type: string
          enum: [granted, denied]
        photos:
          type: string
          enum: [granted, denied]
        analytics:
          type: string
          enum: [granted, denied]
    Deletion:
      type: object
      required: [scheduled]
      properties:
        scheduled:
          type: boolean
        deleteOn:
          type: string
          format: date-time
          description: When the account and personal data are deleted. Only when scheduled.
    SupportMessage:
      type: object
      required: [category, text]
      properties:
        category:
          type: string
          enum: [billing, account, bug, other]
        text:
          type: string
          minLength: 1
          maxLength: 4000
        diagnostics:
          $ref: "#/components/schemas/Diagnostics"
    Diagnostics:
      type: object
      description: What the phone adds to help support. Nothing here names the person or a place.
      properties:
        appVersion:
          type: string
          maxLength: 32
        os:
          type: string
          enum: [ios, android]
        osVersion:
          type: string
          maxLength: 32
        deviceModel:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 35
        requestId:
          type: string
          maxLength: 64
          description: The request id of a failed call, if the person is reporting one.
    SupportReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: string
    Event:
      type: object
      required: [name, at]
      properties:
        name:
          type: string
          maxLength: 64
        at:
          type: string
          format: date-time
        props:
          type: object
          description: |
            At most 10 properties. Values are identifiers (letters, digits and
            `_ . : -`, up to 64 characters), numbers or booleans; the server drops
            anything else, and any property whose name suggests personal data.
          additionalProperties: {}
    EventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/Event"
    EventReceipt:
      type: object
      required: [accepted, dropped]
      properties:
        accepted:
          type: integer
        dropped:
          type: integer
    SponsoredCard:
      type: object
      required: [id, sponsor, title, url]
      properties:
        id:
          type: string
        sponsor:
          type: string
          description: Who pays for the card. Shown next to the "Sponsored" label, which the app always draws.
        title:
          type: string
        body:
          type: string
        imageUrl:
          type: string
          format: uri
        url:
          type: string
          format: uri
    SponsoredResult:
      type: object
      properties:
        card:
          $ref: "#/components/schemas/SponsoredCard"
    SponsoredHidden:
      type: object
      required: [hiddenUntil]
      properties:
        hiddenUntil:
          type: string
          format: date-time
    AskRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
          description: What the person wants, in their own words.
        lang:
          type: string
          description: BCP 47 language for the notes. Defaults to the person's language.
    AskDraftItem:
      type: object
      required: [placeId, name]
      properties:
        placeId:
          type: string
          description: A catalogue place id. Add it as a stop of kind catalog.
        name:
          type: string
        note:
          type: string
          description: Why it fits, one short line.
    AskDraftDay:
      type: object
      required: [day, items]
      properties:
        day:
          type: integer
          minimum: 1
          description: Day 1, 2, ... of the draft. The app maps it onto the trip's dates.
        items:
          type: array
          items:
            $ref: "#/components/schemas/AskDraftItem"
    AskDraft:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/AskDraftDay"
        remaining:
          type: integer
          description: Drafts left this month, or -1 for no cap.
    FlightStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [scheduled, delayed, cancelled, departed, landed, unknown]
        departure:
          $ref: "#/components/schemas/FlightLeg"
        arrival:
          $ref: "#/components/schemas/FlightLeg"
        updatedAt:
          type: string
          format: date-time
    FlightLeg:
      type: object
      properties:
        scheduled:
          type: string
          format: date-time
        estimated:
          type: string
          format: date-time
        terminal:
          type: string
        gate:
          type: string
    StayLink:
      type: object
      required: [partnerId, name, url]
      properties:
        partnerId:
          type: string
        name:
          type: string
          description: The partner's name, shown on the button.
        url:
          type: string
          format: uri
    StayLinkList:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/StayLink"
    StayClick:
      type: object
      required: [partnerId]
      properties:
        partnerId:
          type: string
    PlaceGroup:
      type: string
      enum: [see, eat, stay, do, shop, nightlife]
    CatalogPlacePhoto:
      type: object
      required: [url, attribution, source, licence]
      properties:
        url:
          type: string
          format: uri
        attribution:
          type: string
          description: Author and credit line. Show it with the photo.
        source:
          type: string
        licence:
          type: string
    CatalogPlaceSource:
      type: object
      required: [field, source, licence]
      properties:
        field:
          type: string
        source:
          type: string
        licence:
          type: string
        sourceId:
          type: string
    CatalogPlace:
      type: object
      required: [id, name, lat, lng, group, categories, photos, sources]
      properties:
        id:
          type: string
        name:
          type: string
          description: In the requested language when we have it.
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
        group:
          $ref: "#/components/schemas/PlaceGroup"
        categories:
          type: array
          items:
            type: string
        countryCode:
          type: string
        timeZone:
          type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/CatalogPlacePhoto"
        openingHours:
          type: array
          description: |
            When the place is open, in its own time zone (`timeZone`). Left out when
            we do not know. A weekday with no entry is closed that day.
          items:
            $ref: "#/components/schemas/OpeningPeriod"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CatalogPlaceSource"
        distanceMeters:
          type: number
          format: double
          description: From the search point. Only in the nearby list.
    OpeningPeriod:
      type: object
      required: [day, open, close]
      properties:
        day:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun]
        open:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Opening time, 24-hour HH:MM. The app formats it for the person's clock setting.
        close:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Closing time. Earlier than `open` means it closes after midnight, on the next day.
    CatalogPlaceList:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            $ref: "#/components/schemas/CatalogPlace"
        nextCursor:
          type: string
          description: Present when more places follow.
    RecommendationReason:
      type: string
      enum: [style, quality, distance, popularity]
      description: |
        Why a pick scored well: fits the crew's style, well rated, close to the
        trip's stops, or saved by many crews (only from 20 crews).
    Recommendation:
      type: object
      required: [place, score, reasons]
      properties:
        place:
          $ref: "#/components/schemas/CatalogPlace"
        score:
          type: number
          format: double
          description: 0 to 1. Only for ordering; do not show it.
        reasons:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/RecommendationReason"
    RecommendationList:
      type: object
      required: [category, items, hasMore]
      properties:
        category:
          $ref: "#/components/schemas/PlaceGroup"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        hasMore:
          type: boolean
          description: True when more picks exist than were returned.
    StampKind:
      type: string
      enum: [createTrip, inviteCrew, addPlaces, logExpense, writeJournal]
    Stamp:
      type: object
      required: [kind, earned]
      properties:
        kind:
          $ref: "#/components/schemas/StampKind"
        earned:
          type: boolean
        earnedAt:
          type: string
          format: date-time
          description: When it was earned. Missing until then.
    StampList:
      type: object
      required: [stamps, earned, total]
      properties:
        stamps:
          type: array
          items:
            $ref: "#/components/schemas/Stamp"
        earned:
          type: integer
        total:
          type: integer
    DeviceRegistration:
      type: object
      required: [platform, pushToken]
      properties:
        platform:
          type: string
          enum: [ios, android]
        pushToken:
          type: string
          maxLength: 4096
          description: The FCM token (iOS goes through FCM as well).
    MeUpdate:
      type: object
      description: Fields to change. Leave a field out to keep it.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        travelStyle:
          $ref: "#/components/schemas/TravelStyle"
        notifications:
          type: object
          description: >-
            Push settings. Keys are `all` and the event kinds memberJoined,
            stopAdded, pollCreated, expenseAdded and meetPoint. A missing key
            means on. `all: false` mutes everything.
          additionalProperties:
            type: boolean
        homeRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the person's home country.
        homeCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Used for display and as a default for new trips.
        units:
          $ref: "#/components/schemas/Units"
        regionSource:
          type: string
          enum: [device, confirmed]
          description: "`device` when guessed from the phone, `confirmed` once the person chose."
    Units:
      type: object
      description: How the person likes distances, temperatures and times shown. Send all four fields.
      required: [distance, temperature, clock, firstWeekday]
      properties:
        distance:
          type: string
          enum: [km, mi]
        temperature:
          type: string
          enum: [c, f]
        clock:
          type: string
          enum: [12h, 24h]
        firstWeekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday.
    TravelStyle:
      type: object
      description: The chips picked in onboarding. Any part may be left empty.
      properties:
        interests:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              [
                mountains,
                beaches,
                foodTrails,
                roadTrips,
                cultureHistory,
                nightlife,
                wildlife,
                slowCafes,
              ]
        pace:
          type: string
          enum: [slow, balanced, packed]
        spend:
          type: string
          enum: [shoestring, comfort, splurge]
    Destination:
      type: object
      required: [name, countryCode, timeZone]
      properties:
        name:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2, upper case.
        timeZone:
          type: string
          description: IANA zone, such as Asia/Tokyo.
        localCurrency:
          type: string
          description: ISO 4217, upper case. Optional.
    TripDates:
      type: object
      description: Either `start` and `end`, or `flexible`, never both.
      properties:
        start:
          type: string
          description: YYYY-MM-DD
        end:
          type: string
          description: YYYY-MM-DD
        flexible:
          type: object
          required: [days]
          properties:
            days:
              type: integer
              minimum: 1
            month:
              type: string
              description: YYYY-MM, optional.
    TripStatus:
      type: string
      enum: [draft, planned, active, past]
    PlaceRef:
      type: object
      description: A catalogue place by `placeId`, or a pin the person dropped (`name`, `lat`, `lng`).
      properties:
        placeId:
          type: string
        name:
          type: string
          maxLength: 200
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
          maxLength: 300
          description: Optional, for a pin the person dropped.
        category:
          type: string
          enum: [food, sights, activity, shopping, stay, transport, other]
          description: Optional, for a pin the person dropped.
    StopFields:
      type: object
      properties:
        startLocal:
          type: string
          description: Start time as HH:mm, in the stop's time zone.
        durationMin:
          type: integer
          minimum: 0
          maximum: 1440
        note:
          type: string
          maxLength: 2000
    Stop:
      allOf:
        - $ref: "#/components/schemas/StopFields"
        - type: object
          required: [id, tripId, date, order, place, timeZone]
          properties:
            id:
              type: string
            tripId:
              type: string
            date:
              type: string
              description: The day, YYYY-MM-DD.
            order:
              type: string
              description: Sort key within the day. Opaque; sort by date, then this.
            place:
              $ref: "#/components/schemas/PlaceRef"
            timeZone:
              type: string
    StopList:
      type: object
      required: [stops]
      properties:
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
    StopCreate:
      allOf:
        - $ref: "#/components/schemas/StopFields"
        - type: object
          required: [date, place]
          properties:
            date:
              type: string
            place:
              $ref: "#/components/schemas/PlaceRef"
            beforeStopId:
              type: string
              description: Put the stop just before this one on the same day.
    StopUpdate:
      allOf:
        - $ref: "#/components/schemas/StopFields"
        - type: object
          properties:
            date:
              type: string
              description: Move to this day.
            beforeStopId:
              type: string
              description: Put the stop just before this one on the target day.
    BestOrder:
      type: object
      required: [date, changed, approx, beforeMin, afterMin, stopIds]
      properties:
        date:
          type: string
        changed:
          type: boolean
          description: False when the current order is already the best found.
        approx:
          type: boolean
          description: True when travel times are straight-line estimates.
        beforeMin:
          type: integer
          description: Estimated travel minutes in the current order.
        afterMin:
          type: integer
          description: Estimated travel minutes in the suggested order.
        stopIds:
          type: array
          description: The stop IDs in the suggested order.
          items:
            type: string
    DayOrder:
      type: object
      required: [stopIds]
      properties:
        stopIds:
          type: array
          items:
            type: string
    Trip:
      type: object
      required:
        [id, title, ownerId, destinations, dates, timeZone, settlementCurrency, status, role]
      properties:
        id:
          type: string
        title:
          type: string
        ownerId:
          type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        dates:
          $ref: "#/components/schemas/TripDates"
        budget:
          $ref: "#/components/schemas/TripBudget"
        timeZone:
          type: string
          description: IANA zone the trip's days are counted in.
        settlementCurrency:
          type: string
          description: ISO 4217. One per trip. Fixed at creation.
        status:
          $ref: "#/components/schemas/TripStatus"
        role:
          type: string
          enum: [owner, editor, viewer]
          description: The caller's role on this trip.
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Integer minor units. JPY and VND have no minor digits, so 1000 is 1000 yen.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
    Rate:
      type: object
      description: |
        Original to settlement currency, as a ratio of minor units:
        settlement = original x numerator / denominator, rounded half away
        from zero. Saved with the expense; never changed by a later rate refresh.
      required: [numerator, denominator]
      properties:
        numerator:
          type: integer
          format: int64
          minimum: 1
        denominator:
          type: integer
          format: int64
          minimum: 1
    SplitInput:
      type: object
      required: [method, parts]
      properties:
        method:
          type: string
          enum: [equal, exact, percent, shares]
        parts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [uid]
            properties:
              uid:
                type: string
              value:
                type: integer
                format: int64
                description: Ignored for equal. Settlement minor units for exact, basis points (10000 is 100%) for percent, a weight for shares.
    ExpenseShare:
      type: object
      required: [uid, amountMinor]
      properties:
        uid:
          type: string
        amountMinor:
          type: integer
          format: int64
          description: In the settlement currency.
    Expense:
      type: object
      required: [id, description, paidByUid, date, original, settlement, split, createdBy]
      properties:
        id:
          type: string
        description:
          type: string
        category:
          type: string
        paidByUid:
          type: string
        date:
          type: string
          description: Calendar date, YYYY-MM-DD.
        original:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        settlement:
          $ref: "#/components/schemas/Money"
        split:
          type: object
          required: [method, shares]
          properties:
            method:
              type: string
              enum: [equal, exact, percent, shares]
            shares:
              type: array
              items:
                $ref: "#/components/schemas/ExpenseShare"
        createdBy:
          type: string
    ExpenseList:
      type: object
      required: [expenses]
      properties:
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
    ExpenseCreate:
      type: object
      required: [description, paidByUid, date, original, split]
      properties:
        id:
          type: string
          description: Optional ID made on the phone so a retry cannot add the expense twice.
        description:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 40
        paidByUid:
          type: string
        date:
          type: string
        original:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        split:
          $ref: "#/components/schemas/SplitInput"
    ExpenseUpdate:
      type: object
      properties:
        description:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 40
        paidByUid:
          type: string
        date:
          type: string
        original:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        split:
          $ref: "#/components/schemas/SplitInput"
    Transfer:
      type: object
      required: [fromUid, toUid, amountMinor]
      properties:
        fromUid:
          type: string
        toUid:
          type: string
        amountMinor:
          type: integer
          format: int64
    Balances:
      type: object
      required: [currency, balances, transfers]
      properties:
        currency:
          type: string
          description: The trip's settlement currency.
        balances:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseShare"
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"
    SettlementCreate:
      type: object
      required: [fromUid, toUid, amountMinor]
      properties:
        id:
          type: string
        fromUid:
          type: string
        toUid:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: In the settlement currency.
        method:
          type: string
          maxLength: 20
          description: The payment app used, or "manual".
    Settlement:
      type: object
      required: [id, fromUid, toUid, amount, markedBy]
      properties:
        id:
          type: string
        fromUid:
          type: string
        toUid:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        method:
          type: string
        markedBy:
          type: string
    SettlementList:
      type: object
      required: [settlements]
      properties:
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
    BookingPlace:
      type: object
      required: [name]
      properties:
        code:
          type: string
          maxLength: 10
          description: Airport or station code, if there is one.
        name:
          type: string
          maxLength: 120
    BookingFields:
      type: object
      properties:
        provider:
          type: string
          maxLength: 120
          description: Airline, hotel or operator.
        startsAt:
          type: string
          format: date-time
          description: UTC instant. An update can change it but not clear it yet.
        endsAt:
          type: string
          format: date-time
        startTimeZone:
          type: string
          description: IANA zone, so times show local at each end.
        endTimeZone:
          type: string
        from:
          $ref: "#/components/schemas/BookingPlace"
        to:
          $ref: "#/components/schemas/BookingPlace"
        price:
          $ref: "#/components/schemas/Money"
    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingFields"
        - type: object
          required: [id, kind, title]
          properties:
            id:
              type: string
            kind:
              $ref: "#/components/schemas/BookingKind"
            title:
              type: string
    BookingKind:
      type: string
      enum: [flight, stay, train, bus, activity, other]
    BookingCreate:
      allOf:
        - $ref: "#/components/schemas/BookingFields"
        - type: object
          required: [kind, title]
          properties:
            kind:
              $ref: "#/components/schemas/BookingKind"
            title:
              type: string
              maxLength: 120
    BookingUpdate:
      allOf:
        - $ref: "#/components/schemas/BookingFields"
        - type: object
          properties:
            kind:
              $ref: "#/components/schemas/BookingKind"
            title:
              type: string
              maxLength: 120
    BookingImportRequest:
      type: object
      description: Exactly one of text or pdfBase64.
      properties:
        text:
          type: string
          maxLength: 20000
        pdfBase64:
          type: string
          description: A PDF, base64 encoded.
    BookingImportResult:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/BookingCandidate"
    BookingCandidate:
      type: object
      required: [booking, confidence]
      properties:
        booking:
          $ref: "#/components/schemas/BookingCreate"
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
    BookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    Recap:
      type: object
      required: [tripId, days, stops, crew, distanceMeters, spentMinor, currency, highlights]
      properties:
        tripId:
          type: string
        days:
          type: integer
          description: Days of a dated trip, or days that have stops when the trip has no fixed dates.
        stops:
          type: integer
        crew:
          type: integer
          description: Active members.
        distanceMeters:
          type: integer
          format: int64
          description: |
            Straight-line distance between consecutive pinned stops on each
            day. Show it in the person's units.
        spentMinor:
          type: integer
          format: int64
        currency:
          type: string
          description: The trip's settlement currency.
        targetMinor:
          type: integer
          format: int64
          description: Absent when there is no budget in the settlement currency.
        remainingMinor:
          type: integer
          format: int64
          description: Target minus spent. Negative when over.
        settledUp:
          type: boolean
          description: Absent when settle-up is off.
        favouriteDay:
          $ref: "#/components/schemas/RecapDay"
        highlights:
          type: array
          description: Up to five journal snippets, oldest first.
          items:
            $ref: "#/components/schemas/RecapHighlight"
    RecapDay:
      type: object
      description: The day with the most journal entries.
      required: [date, entries]
      properties:
        date:
          type: string
        entries:
          type: integer
    RecapHighlight:
      type: object
      required: [date, authorUid, text]
      properties:
        date:
          type: string
        authorUid:
          type: string
        text:
          type: string
    BudgetSummary:
      type: object
      required: [currency, spentMinor, overBudget, byCategory]
      properties:
        currency:
          type: string
          description: The trip's settlement currency.
        spentMinor:
          type: integer
          format: int64
        targetMinor:
          type: integer
          format: int64
          description: Absent when the trip has no budget, or the budget is in another currency.
        remainingMinor:
          type: integer
          format: int64
          description: Target minus spent. Negative when over.
        overBudget:
          type: boolean
        byCategory:
          type: array
          description: Biggest spend first. An empty category means the expenses had none.
          items:
            type: object
            required: [category, spentMinor]
            properties:
              category:
                type: string
              spentMinor:
                type: integer
                format: int64
    TripBudget:
      type: object
      description: The optional trip budget. Only the owner can set it. Used by the budget summary when it is in the trip's settlement currency.
      required: [scope, amount]
      properties:
        scope:
          type: string
          enum: [perPerson, group]
        amount:
          $ref: "#/components/schemas/Money"
    RateQuote:
      type: object
      required: [from, to, rate, asOf]
      properties:
        from:
          type: string
        to:
          type: string
        rate:
          $ref: "#/components/schemas/Rate"
        asOf:
          type: string
          description: The UTC day the rate is for, YYYY-MM-DD.
    PlaceSearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PlaceSearchResult"
    PlaceSearchResult:
      type: object
      required: [name, lat, lng]
      properties:
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        category:
          type: string
          enum: [food, sights, activity, shopping, stay, transport, other]
    PollOptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 100
        place:
          $ref: "#/components/schemas/PlaceRef"
    PollCreate:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
          maxLength: 200
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/PollOptionInput"
        multi:
          type: boolean
          description: Allow several options per vote. Defaults to one.
        closesAt:
          type: string
          format: date-time
          description: Votes stop at this time. Absent means open until closed by hand.
    PollOption:
      type: object
      required: [id, label, votes]
      properties:
        id:
          type: string
        label:
          type: string
        place:
          $ref: "#/components/schemas/PlaceRef"
        votes:
          type: integer
    PollResult:
      type: object
      required: [decidedBy]
      properties:
        optionId:
          type: string
          description: Absent when the poll ran out of time with no clear winner.
        decidedBy:
          type: string
          enum: [vote, owner]
    Poll:
      type: object
      required: [id, question, options, multi, status, createdBy, myVote, voters]
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        multi:
          type: boolean
        status:
          type: string
          enum: [open, closed]
        closesAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        myVote:
          type: array
          items:
            type: string
          description: Option IDs the caller picked, empty if they have not voted.
        voters:
          type: integer
          description: How many people have voted.
        result:
          $ref: "#/components/schemas/PollResult"
    PollList:
      type: object
      required: [polls]
      properties:
        polls:
          type: array
          items:
            $ref: "#/components/schemas/Poll"
    PollVote:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
    PollClose:
      type: object
      properties:
        optionId:
          type: string
          description: Pick the winner by hand. Needed on a tie or with no votes.
        addToDate:
          type: string
          description: YYYY-MM-DD. Add the winning place to the itinerary on this day.
    PollClosed:
      type: object
