          description: How long to share, counted from when sharing starts. Defaults to 60. Ignored on updates while sharing.
        meetPointId:
          type: string
          description: End sharing when this meet point ends.
    SharedLocation:
      type: object
      required: [uid, lat, lng, accuracyM, updatedAt, endsAt]
      properties:
        uid:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        accuracyM:
          type: integer
        meetPointId:
          type: string
        updatedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    SharedLocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/SharedLocation"
    CommentCreate:
      type: object
