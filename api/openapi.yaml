      summary: List comments
      description: |
        Oldest first. Filter to one thread with `targetType` and `targetId`
        (give both or neither). Any active member can read.
      parameters:
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            enum: [stop, trip]
        - name: targetId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createComment
      tags: [comments]
      summary: Comment on a stop or the trip
      description: |
        Any active member, viewers included. A stop must exist on the trip.
        For the trip itself, `targetId` is the trip's ID. Mentions must be
        active members.
      requestBody:
        required: true
