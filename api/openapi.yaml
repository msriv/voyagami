openapi: 3.1.0
info:
  title: Voyagami API
  version: 0.1.0
  description: |
    The contract between the Voyagami app and the Go API. This file is the
    source of truth: the Go server interface and the app's typed client are
    generated from it. Run `make api-client` after changing it.

    Money is always an integer in minor units plus an ISO 4217 currency code,
    never a float. No endpoint carries or logs personal data it does not need.
servers:
  - url: /
tags:
  - name: system
    description: Process health.
  - name: auth
    description: Phone sign-in, token refresh and sign-out.
  - name: account
    description: The signed-in person.
  - name: privacy
    description: Consent choices, data export and account deletion.
  - name: support
    description: Messages to support.
  - name: analytics
    description: Product events.
  - name: sponsored
    description: Sponsored cards.
  - name: ask
    description: AI trip drafts.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report that the process is up
      description: |
        Checks no dependencies. Used by deploy checks and uptime checks.
        Not `/healthz`: Google's front end on `*.run.app` answers that path
        itself, so a request to it never reaches the container.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me/consents:
    get:
      operationId: getMyConsents
      tags: [privacy]
      summary: The signed-in person's consent choices
      description: |
        One answer per purpose: `unset` (never asked), `granted` or `denied`.
        Each can be changed later. Needs a bearer token.
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consents"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateMyConsents
      tags: [privacy]
      summary: Change consent choices
      description: Changes only the purposes that are sent. Needs a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentsUpdate"
      responses:
        "200":
          description: The choices after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consents"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me/export:
    get:
      operationId: exportMyData
      tags: [privacy]
      summary: Download the person's data
      description: |
        A ZIP with JSON and CSV files of the person's trips, stops, expenses and
        journal. Free for everyone. Needs a bearer token.
      responses:
        "200":
          description: The ZIP file.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me/deletion:
    get:
      operationId: getMyDeletion
      tags: [privacy]
      summary: Whether account deletion is scheduled
      responses:
        "200":
          description: The deletion state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: cancelMyDeletion
      tags: [privacy]
      summary: Keep the account after all
      description: Cancels a scheduled deletion. Succeeds when none is scheduled.
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/support/messages:
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a message to support
      description: |
        From the in-app Help screen. The diagnostics come from the phone; they
        carry no phone number, location or trip content. Needs a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessage"
      responses:
        "202":
          description: Received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/events:
    post:
      operationId: sendEvents
      tags: [analytics]
      summary: Send product events in a batch
      description: |
        Funnel and paywall events. No phone numbers, locations or free text:
        the server drops any event whose name is not on the list in
        `docs/analytics.md`, and any property that is not a short string, a
        number or a boolean. Events from a person who has not granted the
        `analytics` consent are dropped. Needs a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "200":
          description: How many events were kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/sponsored:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: group
        in: query
        required: false
        description: The list the card would sit in. Left out for the trip-wide list.
        schema:
          $ref: "#/components/schemas/PlaceGroup"
    get:
      operationId: getSponsoredCard
      tags: [sponsored]
      summary: The sponsored card for a list, if there is one
      description: |
        At most one card, on every plan including Plus. Chosen by the trip's
        destination and the list's group only. A card the person hid is not
        returned for 30 days. Needs a bearer token and membership.
      responses:
        "200":
          description: The card, or none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sponsored/{cardId}/impressions:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: recordSponsoredImpression
      tags: [sponsored]
      summary: The card was shown
      description: Counted once per person per card per day. Needs a bearer token.
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sponsored/{cardId}/clicks:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: recordSponsoredClick
      tags: [sponsored]
      summary: The card was tapped
      description: Counted once per person per card per day. Needs a bearer token.
      responses:
        "204":
          description: Recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/sponsored/{cardId}/hide:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: hideSponsoredCard
      tags: [sponsored]
      summary: Hide this card for 30 days
      description: Needs a bearer token.
      responses:
        "200":
          description: When the card may come back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredHidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/ask/drafts:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createAskDraft
      tags: [ask]
      summary: Ask for a day-by-day draft
      description: |
        The person describes what they want. The draft is built only from places
        in our own catalogue near the trip, so nothing is invented. It is a
        preview: nothing is added to the trip until the person picks items and
        adds them as stops. The text is treated as data, never as instructions.
        Counts against the monthly Ask limit (Free 3, Plus fair use); answers 403
        with code `limit_reached` and feature `askDrafts` when it is used up.
        Needs a bearer token and an editor or owner role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/bookings/{bookingId}/flight-status:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFlightStatus
      tags: [bookings]
      summary: Live status of a flight booking
      description: |
        Matches the booking's airline and flight number to the status provider.
        Answers 503 until a provider is set up. Needs a bearer token and
        membership.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me/entitlements:
    get:
      operationId: getMyEntitlements
      tags: [plans]
      summary: What the signed-in person's plan allows
      description: |
        One answer per feature, decided on the server. The app only reflects it.
        Features that belong to a trip are answered as if no trip is open; ask
        the trip's own endpoint for those. Needs a bearer token.
      responses:
        "200":
          description: The plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/plans/free:
    get:
      operationId: getFreePlanLimits
      tags: [plans]
      summary: What the Free plan allows
      description: |
        The Free plan's answer for every feature, read from the same table the
        server checks against. The Plans screen shows it next to Plus. In dev
        every limit is off, so it reads as no cap. Needs a bearer token.
      responses:
        "200":
          description: The Free plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/entitlements:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTripEntitlements
      tags: [plans]
      summary: What a trip allows the signed-in person
      description: |
        Like the person's own answer, but with the trip in view. Whole-trip
        features are open for everyone on the trip when any member has Plus or
        the trip has a Trip Pass. Needs a bearer token and membership.
      responses:
        "200":
          description: The plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/stays/links:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: guests
        in: query
        required: false
        description: How many people are staying. Left out when missing.
        schema:
          type: integer
          minimum: 1
          maximum: 30
    get:
      operationId: listStayLinks
      tags: [stays]
      summary: Hand-off links to stay partners for this trip
      description: |
        One link per configured partner, searching the trip's first
        destination and its dates. Opening a link leaves the app; nothing is
        booked or paid here. The list is empty when no partner is set up.
        Needs a bearer token and membership.
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayLinkList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/stays/clicks:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: recordStayClick
      tags: [stays]
      summary: Count a tap on a stay link
      description: |
        Call when the person opens a link. Only a count per partner and day
        is kept, with no person, trip or place. Needs a bearer token and
        membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StayClick"
      responses:
        "204":
          description: Counted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/recommendations:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listRecommendations
      tags: [places]
      summary: Picks for you in one category
      description: |
        Catalogue places ranked for this trip's crew: how well they fit the
        crew's travel style, quality, distance to the trip's stops, and how
        many crews saved them. Whether a place pays us never matters. Each
        pick comes with up to two reason codes; the app turns them into plain
        words. The search is centred on `lat` and `lng` when given, otherwise
        on the middle of the trip's stops that have a position. With neither
        the answer is 400. Needs a bearer token and membership.
      parameters:
        - name: category
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PlaceGroup"
        - name: lat
          in: query
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusMeters
          in: query
          description: Defaults to 10000, at most 20000.
          schema:
            type: integer
            minimum: 50
            maximum: 20000
        - name: limit
          in: query
          description: How many picks to return. Defaults to 20, at most 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: lang
          in: query
          description: Preferred name language (BCP 47).
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: Picks, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the signed-in person
      description: A sample authenticated endpoint. Needs a bearer token.
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Change the signed-in person's profile
      description: |
        Changes only the fields that are sent. Used by onboarding to save the
        travel style. Needs a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: scheduleMyDeletion
      tags: [privacy]
      summary: Delete the account in 30 days
      description: |
        Schedules deletion 30 days from now. The person stays signed in and can cancel with `DELETE /v1/me/deletion` until then.
        Personal data is deleted then; other people's shared records stay with
        the name removed. Answers 409 with code `subscription_active` while a
        subscription is running, so the person cancels it in the store first.
        Needs a bearer token.
      responses:
        "200":
          description: Deletion is scheduled (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deletion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: A stable id the app makes once per install.
        schema:
          type: string
    put:
      operationId: registerDevice
      tags: [account]
      summary: Register or refresh this phone for push
      description: |
        Call after sign-in and whenever the push token changes. One record per
        device id, so calling again replaces the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "204":
          description: Stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeDevice
      tags: [account]
      summary: Stop pushes to this phone
      description: Call on sign-out. Removing a device that is not there succeeds.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me/stamps:
    get:
      operationId: listMyStamps
      tags: [account]
      summary: The first five stamps and which ones the caller has earned
      description: |
        Always lists all five in the same order. A stamp is earned once and
        stays earned. Earning all five is what the "extra week of Plus"
        reward (VOY-222) is given by the server when the fifth is earned.
      responses:
        "200":
          description: The stamps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StampList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List my trips
      description: |
        Trips the signed-in person is an active member of, soonest first. Trips
        with no fixed dates come after the dated ones. Archived trips (status
        `past`) are included; the app filters them.
      responses:
        "200":
          description: The person's trips.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip
      description: The caller becomes the owner. The trip starts as `planned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreate"
      responses:
        "201":
          description: The new trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip
      description: Only active members can read a trip. Everyone else gets 404, so trip IDs reveal nothing.
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Change or archive a trip
      description: |
        Changes only the fields that are sent. Owners and editors can change
        details. Only the owner can change `status`; setting it to `past`
        archives the trip, and setting it back unarchives it. Nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: The trip after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/tasks:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List a trip's to-dos
      description: Open tasks first, then done ones, oldest first within each. Any member can read.
      responses:
        "200":
          description: The trip's tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add a to-do
      description: Owners and editors only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The new task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
