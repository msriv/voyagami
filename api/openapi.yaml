        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBudget
      tags: [budget]
      summary: Spend against the trip budget
      description: |
        Total spent and spend by category, in the trip's settlement currency,
        worked out from the expenses. When the trip has a budget in that same
        currency, also the target (per-person budgets are multiplied by the
        number of active members), what is left and whether it is over. Any
        active member can read.
      responses:
        "200":
          description: The budget summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/recap:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRecap
      tags: [trips]
      summary: The facts for the trip recap
      description: |
        Days, stops, crew, straight-line distance, spend, budget left, whether
        everyone has settled up, the crew's favourite day and a few journal
        highlights. Built fresh on each call from what the caller may see:
        private journal entries of other people are left out. Parts that need
        a feature that is off are left out too. Any active member can read.
      responses:
        "200":
          description: The recap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/journal:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listJournal
      tags: [journal]
      summary: List journal entries
      description: |
        Entries shared with the crew, plus the caller's own private ones,
        newest day first and then by author. Other people's private entries
        are never returned, not even to the owner. Any active member can read;
        everyone else gets 404.
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/journal/{date}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: path
        required: true
        description: The day, YYYY-MM-DD.
        schema:
          type: string
    put:
      operationId: putJournalEntry
      tags: [journal]
      summary: Write your entry for a day
      description: |
        Creates or replaces the caller's own entry for that day. There is one
        entry per person per day, so repeating the request is safe, which
        suits saving drafts from a phone. Owners and editors only; nobody can
        write for someone else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalWrite"
      responses:
        "200":
          description: The saved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
