openapi: 3.1.0
info:
  title: Voyagami API
  version: 0.1.0
  description: |
    The contract between the Voyagami app and the Go API. This file is the
    source of truth: the Go server interface and the app's typed client are
    generated from it. Run `make api-client` after changing it.

    Money is always an integer in minor units plus an ISO 4217 currency code,
    never a float. No endpoint carries or logs personal data it does not need.
servers:
  - url: /
tags:
  - name: system
    description: Process health.
  - name: auth
    description: Phone sign-in, token refresh and sign-out.
  - name: account
    description: The signed-in person.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report that the process is up
      description: |
        Checks no dependencies. Used by deploy checks and uptime checks.
        Not `/healthz`: Google's front end on `*.run.app` answers that path
        itself, so a request to it never reaches the container.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me/entitlements:
    get:
      operationId: getMyEntitlements
      tags: [plans]
      summary: What the signed-in person's plan allows
      description: |
        One answer per feature, decided on the server. The app only reflects it.
        Features that belong to a trip are answered as if no trip is open; ask
        the trip's own endpoint for those. Needs a bearer token.
      responses:
        "200":
          description: The plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/entitlements:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTripEntitlements
      tags: [plans]
      summary: What a trip allows the signed-in person
      description: |
        Like the person's own answer, but with the trip in view. Whole-trip
        features are open for everyone on the trip when any member has Plus or
        the trip has a Trip Pass. Needs a bearer token and membership.
      responses:
        "200":
          description: The plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the signed-in person
      description: A sample authenticated endpoint. Needs a bearer token.
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Change the signed-in person's profile
      description: |
        Changes only the fields that are sent. Used by onboarding to save the
        travel style. Needs a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List my trips
      description: |
        Trips the signed-in person is an active member of, soonest first. Trips
        with no fixed dates come after the dated ones. Archived trips (status
        `past`) are included; the app filters them.
      responses:
        "200":
          description: The person's trips.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip
      description: The caller becomes the owner. The trip starts as `planned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreate"
      responses:
        "201":
          description: The new trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip
      description: Only active members can read a trip. Everyone else gets 404, so trip IDs reveal nothing.
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Change or archive a trip
      description: |
        Changes only the fields that are sent. Owners and editors can change
        details. Only the owner can change `status`; setting it to `past`
        archives the trip, and setting it back unarchives it. Nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: The trip after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/tasks:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List a trip's to-dos
      description: Open tasks first, then done ones, oldest first within each. Any member can read.
      responses:
        "200":
          description: The trip's tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Add a to-do
      description: Owners and editors only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The new task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/tasks/{taskId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Tick, untick or rename a to-do
      description: Owners and editors only. Changes only the fields that are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: The task after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a to-do
      description: Owners and editors only. Deleting a task that is already gone succeeds.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/expenses:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List a trip's expenses
      description: Expenses that are not deleted, newest date first. Any active member can read; everyone else gets 404.
      responses:
        "200":
          description: The expenses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Add an expense
      description: |
        Owners and editors only. The server converts `original` to the trip's
        settlement currency (using `rate` when the currencies differ) and
        splits the settlement amount with the split logic, so the shares always
        add up to it exactly. Using a second currency is a Plus feature for
        the whole trip. The payer and everyone in the split must be active
        members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
      responses:
        "201":
          description: The new expense.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/expenses/export:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: exportExpenses
      tags: [expenses]
      summary: Export expenses as CSV
      description: |
        Every expense that is not deleted, one row each, with the original and
        converted amounts, the rate and each person's share. Amounts are
        written as decimals using the currency's own minor digits. Free for
        everyone on the trip. Starts with a byte order mark so spreadsheets
        read non-ASCII names correctly. Text that starts with `=`, `+`, `-` or
        `@` is prefixed with a quote so a spreadsheet cannot run it.
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/expenses/{expenseId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Change an expense
      description: |
        The owner can change any expense. An editor can change expenses they
        added or paid for. Changes only the fields that are sent. When
        `original` or `rate` changes, `split` must be sent again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: The expense after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      description: Same role rules as changing one. The expense leaves balances at once. One that is already gone gives 404.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/balances:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBalances
      tags: [settle-up]
      summary: Who owes whom
      description: |
        Net balance per member in the trip's settlement currency, worked out
        from the expenses and the payments already recorded, plus a short list
        of payments that would clear everyone. Positive means the group owes
        that person. Any active member can read; settle-up is free on every plan.
      responses:
        "200":
          description: Balances and suggested payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balances"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/settlements:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listSettlements
      tags: [settle-up]
      summary: List recorded payments
      description: Payments members have marked as paid, oldest first.
      responses:
        "200":
          description: The payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: recordSettlement
      tags: [settle-up]
      summary: Mark a payment as paid
      description: |
        Records that one member paid another, in the settlement currency.
        Voyagami never moves money. Only the payer, the person paid or the
        trip owner can record it. Sending the same `id` again returns the
        stored payment instead of adding another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementCreate"
      responses:
        "201":
          description: The recorded payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/bookings:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List a trip's bookings
      description: Soonest start first; ones with no start time come last. Any active member can read; everyone else gets 404.
      responses:
        "200":
          description: The bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Add a booking
      description: Owners and editors only. Typed in by hand; imports and file attachments come later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreate"
      responses:
        "201":
          description: The new booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/bookings/{bookingId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Change a booking
      description: Owners and editors only. Changes only the fields that are sent. An empty `provider` clears it; times cannot be cleared yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: The booking after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking
      description: Owners and editors only. Deleting a booking that is already gone succeeds.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/budget:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBudget
      tags: [budget]
      summary: Spend against the trip budget
      description: |
        Total spent and spend by category, in the trip's settlement currency,
        worked out from the expenses. When the trip has a budget in that same
        currency, also the target (per-person budgets are multiplied by the
        number of active members), what is left and whether it is over. Any
        active member can read.
      responses:
        "200":
          description: The budget summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/journal:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listJournal
      tags: [journal]
      summary: List journal entries
      description: |
        Entries shared with the crew, plus the caller's own private ones,
        newest day first and then by author. Other people's private entries
        are never returned, not even to the owner. Any active member can read;
        everyone else gets 404.
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/journal/{date}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: path
        required: true
        description: The day, YYYY-MM-DD.
        schema:
          type: string
    put:
      operationId: putJournalEntry
      tags: [journal]
      summary: Write your entry for a day
      description: |
        Creates or replaces the caller's own entry for that day. There is one
        entry per person per day, so repeating the request is safe, which
        suits saving drafts from a phone. Owners and editors only; nobody can
        write for someone else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalWrite"
      responses:
        "200":
          description: The saved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete your entry for a day
      description: Deletes only the caller's own entry. Deleting one that is already gone succeeds.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/rates:
    get:
      operationId: getRate
      tags: [money]
      summary: Suggested exchange rate for a pair of currencies
      description: |
        The rate to put on an expense that is in another currency than the
        trip's settlement currency. It is in minor units, so it already
        accounts for each currency's decimals: `settlement = original x
        numerator / denominator`, rounded half away from zero. Cached for the
        UTC day. The app should let the person override it; whatever rate the
        expense is saved with is the one kept. Any signed-in person can ask.
      parameters:
        - name: from
          in: query
          required: true
          description: ISO 4217 code of the expense currency.
          schema:
            type: string
            pattern: "^[A-Za-z]{3}$"
        - name: to
          in: query
          required: true
          description: ISO 4217 code of the trip's settlement currency.
          schema:
            type: string
            pattern: "^[A-Za-z]{3}$"
      responses:
        "200":
          description: The suggested rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/polls:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listPolls
      tags: [polls]
      summary: List polls
      description: |
        Newest first, with live vote counts and the caller's own vote. Who
        voted for what is not shown. A poll past its `closesAt` reads as
        closed. Any active member can read.
      responses:
        "200":
          description: The polls.
          content:
            application/json:
