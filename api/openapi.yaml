    CommentEdit:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000
        mentions:
          type: array
          maxItems: 10
          items:
            type: string
    Comment:
      type: object
      required: [id, targetType, targetId, authorUid, body, mentions, createdAt]
      properties:
        id:
          type: string
        targetType:
          type: string
          enum: [stop, trip]
        targetId:
          type: string
        authorUid:
          type: string
        body:
          type: string
        mentions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
    CommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
