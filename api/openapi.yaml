        useCount:
          type: integer
        revoked:
          type: boolean
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    InviteCreate:
      type: object
      properties:
        role:
          type: string
          enum: [editor, viewer]
          description: Defaults to editor.
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 8760
          description: Defaults to 168 (7 days).
        maxUses:
          type: integer
          minimum: 1
          maximum: 1000
          description: Absent means unlimited.
    InviteCreated:
      type: object
      required: [invite, token]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
