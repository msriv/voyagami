      summary: Read bookings from a pasted confirmation or a PDF
      description: |
        Send either `text` (a pasted confirmation email or page) or `pdfBase64`
        (a PDF, up to 4 MB). Nothing is saved. The answer lists candidate
        bookings, each with a confidence from 0 to 1, for the person to review
