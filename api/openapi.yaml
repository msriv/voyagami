      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMeetPoints
      tags: [meetup]
      summary: List meet points
      description: Soonest first, ones with no time last. Ended ones stay in the list marked `ended`. Always free. Any active member can read.
      responses:
        "200":
          description: The meet points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetPointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createMeetPoint
      tags: [meetup]
      summary: Propose a meet point
      description: Owners and editors. A meet point ends 3 hours after its time, or a day after it is made when it has no time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetPointCreate"
      responses:
        "201":
          description: The meet point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/meet-points/{meetPointId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: meetPointId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMeetPoint
      tags: [meetup]
      summary: Change a meet point
      description: Owners and editors. Send only what changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetPointUpdate"
      responses:
        "200":
          description: The updated meet point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteMeetPoint
      tags: [meetup]
      summary: Delete a meet point
      description: Owners and editors. Deleting one that is already gone succeeds.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/meet-points/{meetPointId}/confirmation:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: meetPointId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: confirmMeetPoint
      tags: [meetup]
      summary: Say you are coming
      description: Any active member, viewers included. Repeating it is harmless.
      responses:
        "200":
          description: The meet point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: unconfirmMeetPoint
      tags: [meetup]
      summary: Say you are not coming
      description: Any active member. Repeating it is harmless.
      responses:
        "200":
          description: The meet point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/locations:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listSharedLocations
      tags: [meetup]
      summary: Who is sharing their location
      description: |
        Only people who chose to share, and only until their sharing ends.
        Any active member can read. Locations are never logged.
      responses:
        "200":
          description: The shared locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedLocationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/locations/me:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: shareMyLocation
      tags: [meetup]
      summary: Share or update your location
      description: |
        Opt-in. The first call starts sharing for `durationMinutes` (default
        60); later calls move the dot and keep or change the end time. Sharing
        ends by itself, and with `meetPointId` it also ends when that meet
        ends. More than one hour needs Plus (live crew map); anyone on the
        trip, viewers included, can share. Only the caller's own location is
        written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareLocation"
      responses:
        "200":
          description: Your shared location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedLocation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: stopSharingMyLocation
      tags: [meetup]
      summary: Stop sharing your location
      description: Removes your location at once. Stopping when not sharing succeeds.
      responses:
        "204":
          description: Stopped.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/comments:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments
      description: |
        Oldest first. Filter to one thread with `targetType` and `targetId`
        (give both or neither). Any active member can read.
      parameters:
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            enum: [stop, trip]
        - name: targetId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createComment
      tags: [comments]
      summary: Comment on a stop or the trip
      description: |
        Any active member, viewers included. A stop must exist on the trip.
        For the trip itself, `targetId` is the trip's ID. Mentions must be
        active members.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/comments/{commentId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: editComment
      tags: [comments]
      summary: Edit your comment
      description: Only the author. Sets `editedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentEdit"
      responses:
        "200":
          description: The updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      description: The author, or the trip owner. Deleting one that is already gone succeeds.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/members:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listMembers
      tags: [crew]
      summary: List the crew
      description: |
        Everyone with a membership on the trip, oldest first. People who left
        or were removed are included with that status so old expenses still
        show a name. Any active member can read.
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/members/{uid}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: uid
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: setMemberRole
      tags: [crew]
      summary: Change a member's role
      description: Owner only. Switches an active member between editor and viewer. The owner's own role cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleChange"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeMember
      tags: [crew]
      summary: Remove a member or leave the trip
      description: |
        The owner can remove anyone else. Any member can remove themselves,
        which is leaving. The owner cannot leave or be removed. Their
        expenses and entries stay.
      responses:
        "204":
          description: The member is no longer on the trip.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/invites:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listInvites
      tags: [crew]
      summary: List invite links
      description: Owner only. Returns no secrets; the token is shown only once, when the invite is created.
      responses:
        "200":
          description: The invites, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createInvite
      tags: [crew]
      summary: Create an invite link
      description: |
        Owner only. The secret token is returned once and never stored;
        the app builds the share link from it. Joining is always free. Invites
        expire after 7 days unless `expiresInHours` says otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invite and its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/invites/{inviteId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeInvite
      tags: [crew]
      summary: Revoke an invite link
      description: Owner only. Revoking one that is already revoked succeeds. People who already joined stay.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/invites/join:
    post:
      operationId: joinTrip
      tags: [crew]
      summary: Join a trip with an invite token
      description: |
        Adds the caller to the trip with the invite's role. Always free. If the
        caller is already on the trip, the trip is returned and no use is
        counted. A missing, revoked, expired or used-up invite answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteJoin"
      responses:
        "200":
          description: The trip, with the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/stops:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listStops
      tags: [stops]
      summary: List a trip's stops
      description: Stops that are not deleted, sorted by day and then order. Only active members can read them; everyone else gets 404.
      responses:
        "200":
          description: The stops.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createStop
      tags: [stops]
      summary: Add a stop to a day
      description: |
        Owners and editors only. The stop goes to the end of the day, or just
        before `beforeStopId` when that is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopCreate"
      responses:
        "201":
          description: The new stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/stops/{stopId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: stopId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateStop
      tags: [stops]
      summary: Change or move a stop
      description: |
        Owners and editors only. Changes only the fields that are sent. Sending
        `date` moves the stop to that day (to the end of it unless
        `beforeStopId` is sent). Sending `beforeStopId` alone reorders within
        the day. An empty `startLocal` or `note`, or a `durationMin` of 0,
        clears the field. Only the moved stop is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopUpdate"
      responses:
        "200":
          description: The stop after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stop"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteStop
      tags: [stops]
      summary: Remove a stop
      description: Owners and editors only. The stop is hidden, not erased, so it can be restored later.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/days/{date}/best-order:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: path
        required: true
        description: The day, YYYY-MM-DD.
        schema:
          type: string
    post:
      operationId: suggestBestOrder
      tags: [stops]
      summary: Suggest a shorter order for a day
      description: |
        Any member can ask. Nothing is changed. Stops with a start time stay
        where they are, and stops without a map position are left where they
        are too. Travel times are straight-line estimates (`approx`).
      responses:
        "200":
          description: The suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BestOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/days/{date}/order:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setDayOrder
      tags: [stops]
      summary: Set the order of a day's stops
      description: |
        Owners and editors only. `stopIds` must list every stop on the day
        exactly once. Used to accept a suggestion, and to undo it by sending
        the earlier order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayOrder"
      responses:
        "200":
          description: The day's stops in the new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a one-time code to a phone
      description: |
        Sends a six-digit code by SMS. The answer is the same whether or not
        the number already has an account. In dev the code is always `123456`
        and nothing is sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "204":
          description: A code was sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Check a one-time code and sign in
      description: |
        Creates the account the first time a number is verified. Returns a
        short-lived access token and a refresh token. A wrong code answers 400
        with code `invalid_code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Swap a refresh token for a new token pair
      description: |
        Each refresh token works once. Sending one that was already used ends
        the session, so a stolen token cannot be used quietly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: End this device's session
      description: |
        Revokes the refresh token for the session. The access token keeps
        working until it expires, at most 15 minutes.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued after phone sign-in.
  responses:
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request could not be read or a field is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts for this phone number. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The service cannot do this right now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The person is on the trip but their role does not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request is fine but cannot be done in the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such trip, or the person is not a member of it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Phone number in E.164 form, for example `+14155550123`.
          examples: ["+14155550123"]
    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: Phone number in E.164 form.
        code:
          type: string
          description: The one-time code.
        region:
          type: string
          description: Device region (ISO 3166-1 alpha-2). Only used when the account is created, until onboarding confirms it.
          pattern: "^[A-Za-z]{2}$"
        language:
          type: string
          description: Device language (BCP 47). Only used when the account is created.
          maxLength: 35
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    SessionTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, userId, isNewUser]
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        refreshToken:
          type: string
          description: Keep in secure storage. Works once.
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
        userId:
          type: string
        isNewUser:
          type: boolean
          description: True when this sign-in created the account. Always false on refresh.
    Me:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Stable account ID. Not the phone number.
        displayName:
          type: string
          description: Name the person chose, if any.
        travelStyle:
          $ref: "#/components/schemas/TravelStyle"
        homeRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the person's home country.
        homeCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Used for display and as a default for new trips.
        units:
          $ref: "#/components/schemas/Units"
        regionSource:
          type: string
          enum: [device, confirmed]
          description: "`device` when guessed from the phone, `confirmed` once the person chose."
    EntitlementDecision:
      type: object
      required: [allowed, limit, used, needsPlus, readOnly]
      properties:
        allowed:
          type: boolean
          description: Whether one more may be added, or the feature used.
        limit:
          type: integer
          description: The cap. -1 means no cap. For an on/off feature, 0 means Plus only.
        used:
          type: integer
        needsPlus:
          type: boolean
          description: True when the answer is no and Plus or a Trip Pass would change it.
        readOnly:
          type: boolean
          description: True when existing content is over the cap (after a downgrade). It is kept and can be read, but not changed.
    Entitlements:
      type: object
      required: [plan, features]
      properties:
        plan:
          type: string
          enum: [free, plus, pass]
          description: "`pass` only when asked about a trip that has a Trip Pass."
        features:
          type: object
          description: One decision per feature, keyed by feature name.
          additionalProperties:
            $ref: "#/components/schemas/EntitlementDecision"
    MeUpdate:
      type: object
      description: Fields to change. Leave a field out to keep it.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        travelStyle:
          $ref: "#/components/schemas/TravelStyle"
        homeRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the person's home country.
        homeCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Used for display and as a default for new trips.
        units:
          $ref: "#/components/schemas/Units"
        regionSource:
          type: string
          enum: [device, confirmed]
          description: "`device` when guessed from the phone, `confirmed` once the person chose."
    Units:
      type: object
      description: How the person likes distances, temperatures and times shown. Send all four fields.
      required: [distance, temperature, clock, firstWeekday]
      properties:
        distance:
          type: string
          enum: [km, mi]
        temperature:
          type: string
          enum: [c, f]
        clock:
          type: string
          enum: [12h, 24h]
        firstWeekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday.
    TravelStyle:
      type: object
      description: The chips picked in onboarding. Any part may be left empty.
      properties:
        interests:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              [
                mountains,
                beaches,
                foodTrails,
                roadTrips,
                cultureHistory,
                nightlife,
                wildlife,
                slowCafes,
              ]
        pace:
          type: string
          enum: [slow, balanced, packed]
        spend:
          type: string
          enum: [shoestring, comfort, splurge]
    Destination:
      type: object
      required: [name, countryCode, timeZone]
      properties:
        name:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2, upper case.
        timeZone:
          type: string
          description: IANA zone, such as Asia/Tokyo.
        localCurrency:
          type: string
          description: ISO 4217, upper case. Optional.
    TripDates:
      type: object
      description: Either `start` and `end`, or `flexible`, never both.
      properties:
        start:
          type: string
          description: YYYY-MM-DD
        end:
          type: string
          description: YYYY-MM-DD
        flexible:
          type: object
          required: [days]
          properties:
            days:
              type: integer
              minimum: 1
            month:
              type: string
              description: YYYY-MM, optional.
    TripStatus:
      type: string
      enum: [draft, planned, active, past]
    PlaceRef:
      type: object
      description: A catalogue place by `placeId`, or a pin the person dropped (`name`, `lat`, `lng`).
      properties:
        placeId:
          type: string
        name:
          type: string
          maxLength: 200
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
          maxLength: 300
          description: Optional, for a pin the person dropped.
        category:
          type: string
          enum: [food, sights, activity, shopping, stay, transport, other]
          description: Optional, for a pin the person dropped.
    StopFields:
      type: object
      properties:
        startLocal:
          type: string
          description: Start time as HH:mm, in the stop's time zone.
        durationMin:
          type: integer
          minimum: 0
          maximum: 1440
        note:
          type: string
          maxLength: 2000
    Stop:
      allOf:
        - $ref: "#/components/schemas/StopFields"
        - type: object
          required: [id, tripId, date, order, place, timeZone]
          properties:
            id:
              type: string
            tripId:
              type: string
            date:
              type: string
              description: The day, YYYY-MM-DD.
            order:
              type: string
              description: Sort key within the day. Opaque; sort by date, then this.
            place:
              $ref: "#/components/schemas/PlaceRef"
            timeZone:
              type: string
    StopList:
      type: object
      required: [stops]
      properties:
        stops:
          type: array
          items:
            $ref: "#/components/schemas/Stop"
    StopCreate:
      allOf:
        - $ref: "#/components/schemas/StopFields"
        - type: object
          required: [date, place]
          properties:
            date:
              type: string
            place:
              $ref: "#/components/schemas/PlaceRef"
            beforeStopId:
              type: string
              description: Put the stop just before this one on the same day.
    StopUpdate:
      allOf:
        - $ref: "#/components/schemas/StopFields"
        - type: object
          properties:
            date:
              type: string
              description: Move to this day.
            beforeStopId:
              type: string
              description: Put the stop just before this one on the target day.
    BestOrder:
      type: object
      required: [date, changed, approx, beforeMin, afterMin, stopIds]
      properties:
        date:
          type: string
        changed:
          type: boolean
          description: False when the current order is already the best found.
        approx:
          type: boolean
          description: True when travel times are straight-line estimates.
        beforeMin:
          type: integer
          description: Estimated travel minutes in the current order.
        afterMin:
          type: integer
          description: Estimated travel minutes in the suggested order.
        stopIds:
          type: array
          description: The stop IDs in the suggested order.
          items:
            type: string
    DayOrder:
      type: object
      required: [stopIds]
      properties:
        stopIds:
          type: array
          items:
            type: string
    Trip:
      type: object
      required:
        [id, title, ownerId, destinations, dates, timeZone, settlementCurrency, status, role]
      properties:
        id:
          type: string
        title:
          type: string
        ownerId:
          type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        dates:
          $ref: "#/components/schemas/TripDates"
        budget:
          $ref: "#/components/schemas/TripBudget"
        timeZone:
          type: string
          description: IANA zone the trip's days are counted in.
        settlementCurrency:
          type: string
          description: ISO 4217. One per trip. Fixed at creation.
        status:
          $ref: "#/components/schemas/TripStatus"
        role:
          type: string
          enum: [owner, editor, viewer]
          description: The caller's role on this trip.
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Integer minor units. JPY and VND have no minor digits, so 1000 is 1000 yen.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
    Rate:
      type: object
      description: |
        Original to settlement currency, as a ratio of minor units:
        settlement = original x numerator / denominator, rounded half away
        from zero. Saved with the expense; never changed by a later rate refresh.
      required: [numerator, denominator]
      properties:
        numerator:
          type: integer
          format: int64
          minimum: 1
        denominator:
          type: integer
          format: int64
          minimum: 1
    SplitInput:
      type: object
      required: [method, parts]
      properties:
        method:
          type: string
          enum: [equal, exact, percent, shares]
        parts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [uid]
            properties:
              uid:
                type: string
              value:
                type: integer
                format: int64
                description: Ignored for equal. Settlement minor units for exact, basis points (10000 is 100%) for percent, a weight for shares.
    ExpenseShare:
      type: object
      required: [uid, amountMinor]
      properties:
        uid:
          type: string
        amountMinor:
          type: integer
          format: int64
          description: In the settlement currency.
    Expense:
      type: object
      required: [id, description, paidByUid, date, original, settlement, split, createdBy]
      properties:
        id:
          type: string
        description:
          type: string
        category:
          type: string
        paidByUid:
          type: string
        date:
          type: string
          description: Calendar date, YYYY-MM-DD.
        original:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        settlement:
          $ref: "#/components/schemas/Money"
        split:
          type: object
          required: [method, shares]
          properties:
            method:
              type: string
              enum: [equal, exact, percent, shares]
            shares:
              type: array
              items:
                $ref: "#/components/schemas/ExpenseShare"
        createdBy:
          type: string
    ExpenseList:
      type: object
      required: [expenses]
      properties:
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
    ExpenseCreate:
      type: object
      required: [description, paidByUid, date, original, split]
      properties:
        id:
          type: string
          description: Optional ID made on the phone so a retry cannot add the expense twice.
        description:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 40
        paidByUid:
          type: string
        date:
          type: string
        original:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        split:
          $ref: "#/components/schemas/SplitInput"
    ExpenseUpdate:
      type: object
      properties:
        description:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 40
        paidByUid:
          type: string
        date:
          type: string
        original:
          $ref: "#/components/schemas/Money"
        rate:
          $ref: "#/components/schemas/Rate"
        split:
          $ref: "#/components/schemas/SplitInput"
    Transfer:
      type: object
      required: [fromUid, toUid, amountMinor]
      properties:
        fromUid:
          type: string
        toUid:
          type: string
        amountMinor:
          type: integer
          format: int64
    Balances:
      type: object
      required: [currency, balances, transfers]
      properties:
        currency:
          type: string
          description: The trip's settlement currency.
        balances:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseShare"
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/Transfer"
    SettlementCreate:
      type: object
      required: [fromUid, toUid, amountMinor]
      properties:
        id:
          type: string
        fromUid:
          type: string
        toUid:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: In the settlement currency.
        method:
          type: string
          maxLength: 20
          description: The payment app used, or "manual".
    Settlement:
      type: object
      required: [id, fromUid, toUid, amount, markedBy]
      properties:
        id:
          type: string
        fromUid:
          type: string
        toUid:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        method:
          type: string
        markedBy:
          type: string
    SettlementList:
      type: object
      required: [settlements]
      properties:
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"
    BookingPlace:
      type: object
      required: [name]
      properties:
        code:
          type: string
          maxLength: 10
          description: Airport or station code, if there is one.
        name:
          type: string
          maxLength: 120
    BookingFields:
      type: object
      properties:
        provider:
          type: string
          maxLength: 120
          description: Airline, hotel or operator.
        startsAt:
          type: string
          format: date-time
          description: UTC instant. An update can change it but not clear it yet.
        endsAt:
          type: string
          format: date-time
        startTimeZone:
          type: string
          description: IANA zone, so times show local at each end.
        endTimeZone:
          type: string
        from:
          $ref: "#/components/schemas/BookingPlace"
        to:
          $ref: "#/components/schemas/BookingPlace"
        price:
          $ref: "#/components/schemas/Money"
    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingFields"
        - type: object
          required: [id, kind, title]
          properties:
            id:
              type: string
            kind:
              $ref: "#/components/schemas/BookingKind"
            title:
              type: string
    BookingKind:
      type: string
      enum: [flight, stay, train, bus, activity, other]
    BookingCreate:
      allOf:
        - $ref: "#/components/schemas/BookingFields"
        - type: object
          required: [kind, title]
          properties:
            kind:
              $ref: "#/components/schemas/BookingKind"
            title:
              type: string
              maxLength: 120
    BookingUpdate:
      allOf:
        - $ref: "#/components/schemas/BookingFields"
        - type: object
          properties:
            kind:
              $ref: "#/components/schemas/BookingKind"
            title:
              type: string
              maxLength: 120
    BookingList:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
    BudgetSummary:
      type: object
      required: [currency, spentMinor, overBudget, byCategory]
      properties:
        currency:
          type: string
          description: The trip's settlement currency.
        spentMinor:
          type: integer
          format: int64
        targetMinor:
          type: integer
          format: int64
          description: Absent when the trip has no budget, or the budget is in another currency.
        remainingMinor:
          type: integer
          format: int64
          description: Target minus spent. Negative when over.
        overBudget:
          type: boolean
        byCategory:
          type: array
          description: Biggest spend first. An empty category means the expenses had none.
          items:
            type: object
            required: [category, spentMinor]
            properties:
              category:
                type: string
              spentMinor:
                type: integer
                format: int64
    TripBudget:
      type: object
      description: The optional trip budget. Only the owner can set it. Used by the budget summary when it is in the trip's settlement currency.
      required: [scope, amount]
      properties:
        scope:
          type: string
          enum: [perPerson, group]
        amount:
          $ref: "#/components/schemas/Money"
    RateQuote:
      type: object
      required: [from, to, rate, asOf]
      properties:
        from:
          type: string
        to:
          type: string
        rate:
          $ref: "#/components/schemas/Rate"
        asOf:
          type: string
          description: The UTC day the rate is for, YYYY-MM-DD.
    PollOptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          maxLength: 100
        place:
          $ref: "#/components/schemas/PlaceRef"
    PollCreate:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
          maxLength: 200
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/PollOptionInput"
        multi:
          type: boolean
          description: Allow several options per vote. Defaults to one.
        closesAt:
          type: string
          format: date-time
          description: Votes stop at this time. Absent means open until closed by hand.
    PollOption:
      type: object
      required: [id, label, votes]
      properties:
        id:
          type: string
        label:
          type: string
        place:
          $ref: "#/components/schemas/PlaceRef"
        votes:
          type: integer
    PollResult:
      type: object
      required: [decidedBy]
      properties:
        optionId:
          type: string
          description: Absent when the poll ran out of time with no clear winner.
        decidedBy:
          type: string
          enum: [vote, owner]
    Poll:
      type: object
      required: [id, question, options, multi, status, createdBy, myVote, voters]
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        multi:
          type: boolean
        status:
          type: string
          enum: [open, closed]
        closesAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        myVote:
          type: array
          items:
            type: string
          description: Option IDs the caller picked, empty if they have not voted.
        voters:
          type: integer
          description: How many people have voted.
        result:
          $ref: "#/components/schemas/PollResult"
    PollList:
      type: object
      required: [polls]
      properties:
        polls:
          type: array
          items:
            $ref: "#/components/schemas/Poll"
    PollVote:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
    PollClose:
      type: object
      properties:
        optionId:
          type: string
          description: Pick the winner by hand. Needed on a tie or with no votes.
        addToDate:
          type: string
          description: YYYY-MM-DD. Add the winning place to the itinerary on this day.
    PollClosed:
      type: object
