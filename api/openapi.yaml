openapi: 3.1.0
info:
  title: Voyagami API
  version: 0.1.0
  description: |
    The contract between the Voyagami app and the Go API. This file is the
    source of truth: the Go server interface and the app's typed client are
    generated from it. Run `make api-client` after changing it.

    Money is always an integer in minor units plus an ISO 4217 currency code,
    never a float. No endpoint carries or logs personal data it does not need.
servers:
  - url: /
tags:
  - name: system
    description: Process health.
  - name: auth
    description: Phone sign-in, token refresh and sign-out.
  - name: account
    description: The signed-in person.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report that the process is up
      description: |
        Checks no dependencies. Used by deploy checks and uptime checks.
        Not `/healthz`: Google's front end on `*.run.app` answers that path
        itself, so a request to it never reaches the container.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me/entitlements:
    get:
      operationId: getMyEntitlements
      tags: [plans]
      summary: What the signed-in person's plan allows
      description: |
        One answer per feature, decided on the server. The app only reflects it.
        Features that belong to a trip are answered as if no trip is open; ask
        the trip's own endpoint for those. Needs a bearer token.
      responses:
        "200":
          description: The plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}/entitlements:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTripEntitlements
      tags: [plans]
      summary: What a trip allows the signed-in person
      description: |
        Like the person's own answer, but with the trip in view. Whole-trip
        features are open for everyone on the trip when any member has Plus or
        the trip has a Trip Pass. Needs a bearer token and membership.
      responses:
        "200":
          description: The plan and one decision per feature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the signed-in person
      description: A sample authenticated endpoint. Needs a bearer token.
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Change the signed-in person's profile
      description: |
        Changes only the fields that are sent. Used by onboarding to save the
        travel style. Needs a bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List my trips
      description: |
        Trips the signed-in person is an active member of, soonest first. Trips
        with no fixed dates come after the dated ones. Archived trips (status
        `past`) are included; the app filters them.
      responses:
        "200":
          description: The person's trips.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip
      description: The caller becomes the owner. The trip starts as `planned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreate"
      responses:
        "201":
          description: The new trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/trips/{tripId}:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a trip
      description: Only active members can read a trip. Everyone else gets 404, so trip IDs reveal nothing.
      responses:
        "200":
          description: The trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Change or archive a trip
      description: |
        Changes only the fields that are sent. Owners and editors can change
        details. Only the owner can change `status`; setting it to `past`
        archives the trip, and setting it back unarchives it. Nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: The trip after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a one-time code to a phone
      description: |
        Sends a six-digit code by SMS. The answer is the same whether or not
        the number already has an account. In dev the code is always `123456`
        and nothing is sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "204":
          description: A code was sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Check a one-time code and sign in
      description: |
        Creates the account the first time a number is verified. Returns a
        short-lived access token and a refresh token. A wrong code answers 400
        with code `invalid_code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Swap a refresh token for a new token pair
      description: |
        Each refresh token works once. Sending one that was already used ends
        the session, so a stolen token cannot be used quietly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: End this device's session
      description: |
        Revokes the refresh token for the session. The access token keeps
        working until it expires, at most 15 minutes.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token issued after phone sign-in.
  responses:
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request could not be read or a field is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts for this phone number. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The service cannot do this right now.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The person is on the trip but their role does not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such trip, or the person is not a member of it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Phone number in E.164 form, for example `+14155550123`.
          examples: ["+14155550123"]
    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          description: Phone number in E.164 form.
        code:
          type: string
          description: The one-time code.
        region:
          type: string
          description: Device region (ISO 3166-1 alpha-2). Only used when the account is created, until onboarding confirms it.
          pattern: "^[A-Za-z]{2}$"
        language:
          type: string
          description: Device language (BCP 47). Only used when the account is created.
          maxLength: 35
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    SessionTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, userId, isNewUser]
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        refreshToken:
          type: string
          description: Keep in secure storage. Works once.
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
        userId:
          type: string
        isNewUser:
          type: boolean
          description: True when this sign-in created the account. Always false on refresh.
    Me:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Stable account ID. Not the phone number.
        displayName:
          type: string
          description: Name the person chose, if any.
        travelStyle:
          $ref: "#/components/schemas/TravelStyle"
        homeRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the person's home country.
        homeCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Used for display and as a default for new trips.
        units:
          $ref: "#/components/schemas/Units"
        regionSource:
          type: string
          enum: [device, confirmed]
          description: "`device` when guessed from the phone, `confirmed` once the person chose."
    EntitlementDecision:
      type: object
      required: [allowed, limit, used, needsPlus, readOnly]
      properties:
        allowed:
          type: boolean
          description: Whether one more may be added, or the feature used.
        limit:
          type: integer
          description: The cap. -1 means no cap. For an on/off feature, 0 means Plus only.
        used:
          type: integer
        needsPlus:
          type: boolean
          description: True when the answer is no and Plus or a Trip Pass would change it.
        readOnly:
          type: boolean
          description: True when existing content is over the cap (after a downgrade). It is kept and can be read, but not changed.
    Entitlements:
      type: object
      required: [plan, features]
      properties:
        plan:
          type: string
          enum: [free, plus, pass]
          description: "`pass` only when asked about a trip that has a Trip Pass."
        features:
          type: object
          description: One decision per feature, keyed by feature name.
          additionalProperties:
            $ref: "#/components/schemas/EntitlementDecision"
    MeUpdate:
      type: object
      description: Fields to change. Leave a field out to keep it.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        travelStyle:
          $ref: "#/components/schemas/TravelStyle"
        homeRegion:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 code of the person's home country.
        homeCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Used for display and as a default for new trips.
        units:
          $ref: "#/components/schemas/Units"
        regionSource:
          type: string
          enum: [device, confirmed]
          description: "`device` when guessed from the phone, `confirmed` once the person chose."
    Units:
      type: object
      description: How the person likes distances, temperatures and times shown. Send all four fields.
      required: [distance, temperature, clock, firstWeekday]
      properties:
        distance:
          type: string
          enum: [km, mi]
        temperature:
          type: string
          enum: [c, f]
        clock:
          type: string
          enum: [12h, 24h]
        firstWeekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday.
    TravelStyle:
      type: object
      description: The chips picked in onboarding. Any part may be left empty.
      properties:
        interests:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              [
                mountains,
                beaches,
                foodTrails,
                roadTrips,
                cultureHistory,
                nightlife,
                wildlife,
                slowCafes,
              ]
        pace:
          type: string
          enum: [slow, balanced, packed]
        spend:
          type: string
          enum: [shoestring, comfort, splurge]
    Destination:
      type: object
      required: [name, countryCode, timeZone]
      properties:
        name:
          type: string
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2, upper case.
        timeZone:
          type: string
          description: IANA zone, such as Asia/Tokyo.
        localCurrency:
          type: string
          description: ISO 4217, upper case. Optional.
    TripDates:
      type: object
      description: Either `start` and `end`, or `flexible`, never both.
      properties:
        start:
          type: string
          description: YYYY-MM-DD
        end:
          type: string
          description: YYYY-MM-DD
        flexible:
          type: object
          required: [days]
          properties:
            days:
              type: integer
              minimum: 1
            month:
              type: string
              description: YYYY-MM, optional.
    TripStatus:
      type: string
      enum: [draft, planned, active, past]
    Trip:
      type: object
      required:
        [id, title, ownerId, destinations, dates, timeZone, settlementCurrency, status, role]
      properties:
        id:
          type: string
        title:
          type: string
        ownerId:
          type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        dates:
          $ref: "#/components/schemas/TripDates"
        timeZone:
          type: string
          description: IANA zone the trip's days are counted in.
        settlementCurrency:
          type: string
          description: ISO 4217. One per trip. Fixed at creation.
        status:
          $ref: "#/components/schemas/TripStatus"
        role:
          type: string
          enum: [owner, editor, viewer]
          description: The caller's role on this trip.
    TripList:
      type: object
      required: [trips]
      properties:
        trips:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
    TripCreate:
      type: object
      required: [title, destinations, dates, timeZone, settlementCurrency]
      properties:
        title:
          type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        dates:
          $ref: "#/components/schemas/TripDates"
        timeZone:
          type: string
        settlementCurrency:
          type: string
    TripUpdate:
      type: object
      properties:
        title:
          type: string
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/Destination"
        dates:
          $ref: "#/components/schemas/TripDates"
        timeZone:
          type: string
        status:
          $ref: "#/components/schemas/TripStatus"
    Error:
      type: object
      description: |
        The one error shape every non-2xx response uses. Codes: `bad_request`,
        `unauthenticated`, `invalid_code`, `rate_limited`, `forbidden`, `not_found`,
        `method_not_allowed`, `internal`, `unavailable`, `timeout`.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code. The app switches on this.
        message:
          type: string
          description: Plain-English explanation for logs and developers. Not shown to people.
        requestId:
          type: string
          description: Same value as the `X-Request-Id` response header. Quote it in bug reports. Callers may send their own `X-Request-Id` (1 to 64 characters from letters, digits, `-`, `_`, `.`); otherwise the server makes one.
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
security:
  - bearerAuth: []
