      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete your entry for a day
      description: Deletes only the caller's own entry. Deleting one that is already gone succeeds.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/rates:
    get:
      operationId: getRate
      tags: [money]
      summary: Suggested exchange rate for a pair of currencies
      description: |
        The rate to put on an expense that is in another currency than the
        trip's settlement currency. It is in minor units, so it already
        accounts for each currency's decimals: `settlement = original x
        numerator / denominator`, rounded half away from zero. Cached for the
        UTC day. The app should let the person override it; whatever rate the
        expense is saved with is the one kept. Any signed-in person can ask.
      parameters:
        - name: from
          in: query
          required: true
          description: ISO 4217 code of the expense currency.
          schema:
            type: string
            pattern: "^[A-Za-z]{3}$"
        - name: to
          in: query
          required: true
          description: ISO 4217 code of the trip's settlement currency.
          schema:
            type: string
            pattern: "^[A-Za-z]{3}$"
      responses:
        "200":
          description: The suggested rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/places/search:
    get:
      operationId: searchPlaces
      tags: [places]
      summary: Search for a place by name
      description: |
        Autocomplete-style search so the person can add a place without typing
        coordinates. The provider key stays on the server. Results are for
        display now; only the pin the person picks is stored on the stop.
        Pass `lat` and `lng` to prefer results near the trip. Any signed-in
        person can search.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: lat
          in: query
          schema:
            type: number
            format: double
        - name: lng
          in: query
          schema:
            type: number
            format: double
      responses:
        "200":
          description: Up to 10 matches, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceSearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/places/nearby:
    get:
      operationId: listNearbyPlaces
      tags: [places]
      summary: Catalogue places near a point
      description: |
        Places from our own catalogue (not Google), nearest first. Pass the
        `nextCursor` of a page as `cursor` to get the next one. Any signed-in
        person can read.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusMeters
          in: query
          description: Search radius. Defaults to 2000, at most 20000.
          schema:
            type: integer
            minimum: 50
            maximum: 20000
        - name: group
          in: query
          schema:
            $ref: "#/components/schemas/PlaceGroup"
        - name: limit
          in: query
          description: Page size. Defaults to 20, at most 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: lang
          in: query
          description: Preferred name language (BCP 47). Falls back to English, then any name.
          schema:
            type: string
            maxLength: 16
      responses:
        "200":
          description: A page of places.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPlaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/places/{placeId}:
