<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voyagami — Group vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>
:where(a,button){position:relative}:where(a,button)::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
body{margin:0}
a{color:#2D3E8C}a:hover{color:#1F2C6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E6; color: #14161B; font-family: 'Manrope', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 52px 20px 28px 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="GroupHub.dc.html" aria-label="Back to crew" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #14161B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="height: 32px; border-radius: 99px; background: #FFE27A; padding: 0 12px; display: flex; align-items: center; font-size: 12px; font-weight: 800">Closes Wed 18 Nov, 9 PM</span>
  </div>

  <div>
    <div style="font-size: 13px; font-weight: 700; color: #5B6070">Started by Ananya · Day 4 · Sun 22 Nov</div>
    <h1 style="margin: 4px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.035em; line-height: 1">Where's dinner?</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{options}}" as="item" hint-placeholder-count="3">
      <button onClick="{{item.pick}}" aria-pressed="{{item.chosen}}" style="text-align: left; border: 0; border-radius: 20px; padding: 14px 16px; font-family: 'Manrope', sans-serif; color: #14161B; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; box-shadow: {{item.ring}}">
        <span style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span><b style="font-size: 16px">{{item.label}}</b><span style="display: block; font-size: 12px; color: #5B6070; font-weight: 600">{{item.note}}</span></span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">{{item.count}}</span></span>
        <span style="display: block; width: 100%; height: 8px; border-radius: 99px; background: #ECE6D8; overflow: hidden"><span style="display: block; height: 100%; border-radius: 99px; background: {{accent}}; width: {{item.pct}}"></span></span>
        <span style="display: flex; gap: 4px; min-height: 24px"><sc-for list="{{item.voters}}" as="v" hint-placeholder-count="2"><span style="width: 24px; height: 24px; border-radius: 50%; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; background: {{v.bg}}">{{v.initial}}</span></sc-for></span>
      </button>
    </sc-for>
    <button style="height: 52px; border-radius: 18px; border: 2px dashed #B9B2A2; background: transparent; font: 800 14px 'Manrope', sans-serif; color: #14161B">+ Suggest a place</button>
  </div>

  <div style="flex: 1"></div>
  <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; font-size: 13px; font-weight: 600; line-height: 1.45; color: #3B3F4A">When it closes, the winner drops into Day 4 at 7:30 PM and everyone gets a ping. Ties go to the trip owner.</div>
  <div style="font-size: 13px; font-weight: 800; text-align: center">{{status}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5482F","options":["#E5482F","#FFE27A","#F0A898","#D3E4C5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: null };
  }
  renderVals() {
    const accent = this.props.accent ?? '#E5482F';
    const bg = { M: accent, A: '#FFE27A', R: '#D3E4C5', S: '#DDE4FF' };
    const base = [
      { id: 'food', label: 'Street food walk', note: 'Suggested by Ananya · Old Quarter', voters: ['A', 'R'] },
      { id: 'roof', label: 'Rooftop dinner', note: 'Suggested by Rohan · lake view', voters: [] },
      { id: 'cha', label: 'Chả cá, the classic', note: 'Suggested by you', voters: [] }
    ];
    const pick = this.state.pick;
    const options = base.map((o) => {
      const voters = pick === o.id ? o.voters.concat(['M']) : o.voters;
      return {
        label: o.label,
        note: o.note,
        count: String(voters.length),
        pct: (voters.length / 4 * 100) + '%',
        chosen: pick === o.id ? 'true' : 'false',
        ring: pick === o.id ? 'inset 0 0 0 3px #14161B' : 'none',
        voters: voters.map((v) => ({ initial: v, bg: bg[v] })),
        pick: () => this.setState({ pick: pick === o.id ? null : o.id })
      };
    });
    const voted = 2 + (pick ? 1 : 0);
    return {
      accent,
      options,
      status: pick ? voted + ' of 4 voted · tap again to change' : 'Tap an option to vote · 2 of 4 voted'
    };
  }
}
</script>
</body>
</html>
