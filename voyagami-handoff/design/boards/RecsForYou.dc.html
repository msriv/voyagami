<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voyagami — Picked for your crew</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>
:where(a,button){position:relative}:where(a,button)::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
body{margin:0}
a{color:#2D3E8C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E6; color: #14161B; font-family: 'Manrope', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 52px 20px 20px 20px">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Trip.dc.html" aria-label="Back to trip" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #14161B; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="font-size: 13px; font-weight: 700; color: #5B6070; line-height: 1.3">Hanoi &amp; Ha Long Bay<br>19–27 Nov · 4 travellers</div>
  </div>

  <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.035em; line-height: 1">Picked for your <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em">crew</span></h1>
  <div style="font-size: 13px; font-weight: 600; color: #3B3F4A; margin-top: -4px">Based on your crew's style: food first, slow mornings, mid budget. <a href="OnbStyle.dc.html" style="font-weight: 800">Change</a></div>

  <div role="tablist" aria-label="Recommendation type" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 99px; padding: 4px">
    <button role="tab" onClick="{{pickSights}}" aria-selected="{{sightsSel}}" style="height: 38px; border-radius: 99px; border: 0; font: 800 13px 'Manrope', sans-serif; background: {{sightsBg}}; color: {{sightsFg}}">Sights</button>
    <button role="tab" onClick="{{pickFood}}" aria-selected="{{foodSel}}" style="height: 38px; border-radius: 99px; border: 0; font: 800 13px 'Manrope', sans-serif; background: {{foodBg}}; color: {{foodFg}}">Food</button>
    <a href="RecsStays.dc.html" role="tab" aria-selected="false" style="height: 38px; border-radius: 99px; font: 800 13px 'Manrope', sans-serif; color: #14161B; display: flex; align-items: center; justify-content: center; text-decoration: none">Stays</a>
    <a href="RecsEvents.dc.html" role="tab" aria-selected="false" style="height: 38px; border-radius: 99px; font: 800 13px 'Manrope', sans-serif; color: #14161B; display: flex; align-items: center; justify-content: center; text-decoration: none">Events</a>
  </div>

  <div style="display: flex; gap: 6px; overflow: hidden">
    <span style="height: 32px; border-radius: 99px; background: #14161B; color: #FFFFFF; padding: 0 12px; font-size: 12px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">Near your stay</span>
    <span style="height: 32px; border-radius: 99px; background: #FFFFFF; padding: 0 12px; font-size: 12px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">Open on your days</span>
    <span style="height: 32px; border-radius: 99px; background: #FFFFFF; padding: 0 12px; font-size: 12px; font-weight: 800; display: flex; align-items: center; white-space: nowrap">{{budgetChip}}</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
      <a href="{{p.href}}" style="background: #FFFFFF; border-radius: 20px; padding: 10px; display: flex; gap: 12px; text-decoration: none; color: #14161B; position: relative; border: {{p.border}}">
        <div style="width: 82px; height: 92px; border-radius: 14px; background: {{p.tint}}; flex-shrink: 0; position: relative; overflow: hidden"><img src="{{p.img}}" alt="{{p.name}}" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; align-items: center; gap: 6px"><span style="display: {{p.adShow}}; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; border: 1.5px solid #5B6070; color: #5B6070; border-radius: 6px; padding: 1px 5px">SPONSORED</span><span style="font-size: 11px; font-weight: 700; color: #5B6070">{{p.meta}}</span></div>
          <div style="font-weight: 800; font-size: 15px; line-height: 1.2">{{p.name}}</div>
          <div style="font-size: 12px; font-weight: 600; color: #3B3F4A; line-height: 1.35">{{p.why}}</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 11px; font-weight: 700; color: #5B6070"><span>{{p.proof}}</span><span>{{p.source}}</span></div>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'sights' };
  }
  renderVals() {
    const s = this.state.tab === 'sights';
    const ink = '#14161B', white = '#FFFFFF';
    const card = '0';
    const ad = '1.5px dashed #C9C1AE';
    const sights = [
      { name: 'Temple of Literature', meta: 'Đống Đa · 15 min from stay', why: 'On your Day 2, but that\'s Teachers\' Day. Day 4 morning is quieter.', proof: 'Saved by 214 crews', source: 'Google Maps', tint: '#D3E4C5', img: '/_blob/c0be83be924a13fe006a085089709b39', href: 'PlaceDetail.dc.html', adShow: 'none', border: card },
      { name: 'Hỏa Lò Prison Museum', meta: 'Hoàn Kiếm · 8 min walk', why: 'Indoors, and showers are forecast for Day 3 afternoon.', proof: 'Saved by 160 crews', source: 'Google Maps', tint: '#FFE27A', img: '/_blob/9480f5466ba724d24e9d0990e3b35ad5', href: 'PlaceDetail.dc.html', adShow: 'none', border: card },
      { name: 'Ha Long Bay day cruise', meta: 'Klook · from ₹3,400 pp', why: 'Pickup from the Old Quarter. Shown because you have Ha Long on Day 6.', proof: 'Why am I seeing this?', source: 'Book on Klook ↗', tint: '#E4E8F7', img: '/_blob/3781889b89a4c033cba2b469b4cb616d', href: 'RecsSpec.dc.html', adShow: 'inline-block', border: ad },
      { name: 'Long Biên Bridge at sunrise', meta: 'Free · 6 min from Day 4 start', why: 'Two of you liked sunrise spots on your last trip.', proof: 'Saved by 98 crews', source: 'Wikivoyage', tint: '#F8D9D2', img: '/_blob/e13a56be8b4d3e681bbdfcf5338d9b97', href: 'PlaceDetail.dc.html', adShow: 'none', border: card }
    ];
    const food = [
      { name: 'Bún chả Hương Liên', meta: 'Hai Bà Trưng · ₹250–450 pp', why: 'Your crew put food first. Go before 12, it fills up by lunch.', proof: 'Saved by 301 crews', source: 'Google Maps', tint: '#FFE27A', img: '/_blob/71739c5519e2e92c66e2509e2970a49e', href: 'PlaceDetail.dc.html', adShow: 'none', border: card },
      { name: 'Café Giảng (egg coffee)', meta: 'Hoàn Kiếm · ₹120 pp', why: 'Fills the free hour before 11:00 on Day 2, 4 min from your stop.', proof: 'Saved by 254 crews', source: 'Google Maps', tint: '#F3E6D0', img: '/_blob/57b1503faeedc5d434591956dc895921', href: 'PlaceDetail.dc.html', adShow: 'none', border: card },
      { name: 'Old Quarter street-food walk', meta: 'GetYourGuide · ₹1,900 pp', why: 'Evening tour, 3 hours. Shown because Day 1 evening is empty.', proof: 'Why am I seeing this?', source: 'Book ↗', tint: '#E4E8F7', img: '/_blob/1d03d09374cdc343592cae91197d8c96', href: 'RecsSpec.dc.html', adShow: 'inline-block', border: ad },
      { name: 'Phở 10 Lý Quốc Sư', meta: 'Hoàn Kiếm · ₹200–300 pp', why: 'Breakfast near your stay. Rated well by vegetarians for the broth-free menu.', proof: 'Saved by 188 crews', source: 'Google Maps', tint: '#D3E4C5', img: '/_blob/60d0aa18d413990388ff04ec8b509c4a', href: 'PlaceDetail.dc.html', adShow: 'none', border: card }
    ];
    return {
      items: s ? sights : food,
      budgetChip: s ? 'Free or cheap' : 'Under ₹500 pp',
      pickSights: () => this.setState({ tab: 'sights' }),
      pickFood: () => this.setState({ tab: 'food' }),
      sightsSel: s ? 'true' : 'false', foodSel: s ? 'false' : 'true',
      sightsBg: s ? ink : 'transparent', sightsFg: s ? white : ink,
      foodBg: s ? 'transparent' : ink, foodFg: s ? ink : white
    };
  }
}
</script>
</body>
</html>
