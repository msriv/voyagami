<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voyagami — Journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Caveat:wght@600;700&amp;family=Manrope:wght@400..800&amp;display=swap">
<style>
:where(a,button){position:relative}:where(a,button)::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
body{margin:0}
a{color:#2D3E8C}a:hover{color:#1F2C6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E6; color: #14161B; font-family: 'Manrope', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 24px 20px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Trip.dc.html" aria-label="Back to trip" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #14161B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="display: flex; gap: 6px">
      <span style="height: 32px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; font-size: 12px; font-weight: 800">Day 3 of 9</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; font-size: 12px; font-weight: 800">22° · Misty</span>
    </div>
  </div>

  <div style="position: relative">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #5B6070">SAT · 21 NOV</div>
    <h1 style="margin: 4px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.035em; line-height: 1">Lost in the<br>limestone</h1>
    <div style="position: absolute; right: 4px; top: 0; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #2D3E8C; color: #2D3E8C; transform: rotate(-14deg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-sizing: border-box">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.04em">HA LONG</div>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; line-height: 1">VN</div>
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.04em">21·11·26</div>
    </div>
  </div>

  <div style="position: relative; height: 214px">
    <div style="position: absolute; left: 0; top: 10px; width: 176px; background: #FFFFFF; padding: 8px 8px 30px 8px; transform: rotate(-4deg); box-shadow: 0 10px 24px rgba(20,22,27,0.12); box-sizing: border-box">
      <div style="height: 160px; background: #9FC4E8; position: relative; overflow: hidden"><img src="/_blob/95dd0a5ac06208b41ce81c55da469542" alt="Limestone islands in Ha Long Bay at sunrise" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700">sunrise deck</div>
    </div>
    <div style="position: absolute; left: 160px; top: 0; width: 190px; background: #FFFFFF; padding: 8px 8px 30px 8px; transform: rotate(3deg); box-shadow: 0 10px 24px rgba(20,22,27,0.14); box-sizing: border-box">
      <div style="height: 176px; background: #D3E4C5; position: relative; overflow: hidden"><img src="/_blob/63e58c90861744018d3d5107ecad968f" alt="Boats sailing between the karsts of Ha Long Bay" loading="lazy" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: 'Caveat', cursive; font-size: 19px; font-weight: 700">out on the water</div>
    </div>
    <div style="position: absolute; left: 148px; top: -8px; width: 64px; height: 22px; background: #FFE27A; opacity: 0.9; transform: rotate(-8deg)"></div>
  </div>

  <button style="height: 44px; border-radius: 14px; border: 2px dashed #B9B2A2; background: transparent; font: 800 13px 'Manrope', sans-serif; color: #14161B">14 photos from today near your stops · pick more</button>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 800">How was today?</div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: {{accent}}; color: #14161B; font: 800 13px 'Manrope', sans-serif">Unreal</button>
      <button style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: #FFFFFF; color: #14161B; font: 700 13px 'Manrope', sans-serif">Chill</button>
      <button style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: #FFFFFF; color: #14161B; font: 700 13px 'Manrope', sans-serif">Tiring</button>
      <button style="flex: 1; height: 48px; border-radius: 16px; border: 0; background: #FFFFFF; color: #14161B; font: 700 13px 'Manrope', sans-serif">Meh</button>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
    <div style="display: flex; justify-content: space-between; align-items: center"><label for="entry" style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #5B6070">TODAY'S ENTRY</label><button style="height: 32px; border-radius: 99px; border: 0; background: #F4F0E6; padding: 0 12px; font: 800 12px 'Manrope', sans-serif; color: #14161B">Only me ▾</button></div>
    <textarea id="entry" style="flex: 1; border: 0; resize: none; font: 500 15px/1.5 'Manrope', sans-serif; color: #14161B; padding: 0; background: transparent; outline: none">Woke up to the bay wrapped in fog. Kayaked through the caves after breakfast…</textarea>
    <div style="display: flex; gap: 8px; align-items: center">
      <button aria-label="Add photos" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F4F0E6; color: #14161B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-8 8"></path></svg></button>
      <button aria-label="Record voice note" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F4F0E6; color: #14161B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <button aria-label="Tag a place" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #F4F0E6; color: #14161B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></button>
      <button style="margin-left: auto; height: 44px; border-radius: 14px; border: 0; background: #14161B; color: #FFFFFF; padding: 0 16px; font: 800 13px 'Manrope', sans-serif; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Make trip recap</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5482F","options":["#E5482F","#FFE27A","#F0A898","#D3E4C5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#E5482F' };
  }
}
</script>
</body>
</html>
