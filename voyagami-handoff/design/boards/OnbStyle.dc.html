<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F0E6; color: #14161B; font-family: 'Manrope', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 52px 24px 32px 24px">

    <button aria-pressed="true" style="height: 44px; border-radius: 99px; border: 0; background: #14161B; color: #FFFFFF; padding: 0 16px; font: 800 14px 'Manrope', sans-serif">Road trips</button>
    <button aria-pressed="false" style="height: 44px; border-radius: 99px; border: 0; background: #FFFFFF; color: #14161B; padding: 0 16px; font: 700 14px 'Manrope', sans-serif">Culture &amp; history</button>

    <button aria-pressed="false" style="height: 44px; border-radius: 99px; border: 0; background: #FFFFFF; color: #14161B; padding: 0 16px; font: 700 14px 'Manrope', sans-serif">Wildlife</button>

    <div style="font-size: 13px; font-weight: 800">Pace</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 16px; padding: 4px">
      <button style="height: 44px; border-radius: 12px; border: 0; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14161B">Slow</button>
      <button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; font: 800 14px 'Manrope', sans-serif; color: #14161B">Balanced</button>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 800">Spend style</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 16px; padding: 4px">
      <button style="height: 44px; border-radius: 12px; border: 0; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14161B">Shoestring</button>
      <button style="height: 44px; border-radius: 12px; border: 0; background: {{accent}}; font: 800 14px 'Manrope', sans-serif; color: #14161B">Comfort</button>
      <button style="height: 44px; border-radius: 12px; border: 0; background: transparent; font: 700 14px 'Manrope', sans-serif; color: #14161B">Splurge</button>

    <div style="flex: 1"><div style="font-size: 12px; font-weight: 700; color: #5B6070">Home base · from your phone's region</div><div style="font-weight: 800; font-size: 15px">Bengaluru · ₹ INR</div></div>
    <button style="height: 44px; border: 0; background: transparent; font: 800 14px 'Manrope', sans-serif; color: #2D3E8C">Change</button>

  <div style="flex: 1"></div>
  <a href="OnbConnect.dc.html" style="height: 56px; border-radius: 18px; background: #14161B; color: #FFFFFF; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E5482F","options":["#E5482F","#FFE27A","#F0A898","#D3E4C5"]},"$preview":{"width":390,"height":844}}'>
