name: CI

# Lint, test and build on every pull request (VOY-6).
# Deploys, EAS builds and security scanning are out of scope until P1.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.filter.outputs.js }}
      api: ${{ steps.filter.outputs.api }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            js:
              - 'apps/**'
              - 'api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.nvmrc'
              - '**/*.md'
              - 'design/tokens.json'
              - '.github/workflows/ci.yml'
            api:
              - 'services/api/**'
              - 'api/**'
              - 'infra/scripts/deploy-api-dev.sh'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            rules:
              - 'firebase.json'
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'services/api/**'
              - 'packages/rules-tests/**'
              - '.github/workflows/ci.yml'

  mobile:
    name: Mobile and shared packages
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches api/openapi.yaml
        run: |
          pnpm --filter @voyagami/api-client run generate
          git diff --exit-code -- packages/api-client || (echo "Generated API client is out of date. Run 'make api-client' and commit the result." && exit 1)
      - name: Format and lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test

  api:
    name: Go API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for a Go module
        id: mod
        run: |
          if [ -f services/api/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No services/api/go.mod yet (VOY-91); skipping Go checks."; fi
      - uses: actions/setup-go@v5
        if: steps.mod.outputs.present == 'true'
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        if: steps.mod.outputs.present == 'true'
        working-directory: services/api
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && echo "gofmt - files above need formatting" && exit 1)
      - name: go vet
        if: steps.mod.outputs.present == 'true'
        working-directory: services/api
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        if: steps.mod.outputs.present == 'true'
        with:
          version: v2.5
          working-directory: services/api
          args: --config ../../.golangci.yml
      - name: Generated code matches api/openapi.yaml
        if: steps.mod.outputs.present == 'true'
        working-directory: services/api
        run: |
          go generate ./...
          git diff --exit-code -- . || (echo "Generated code is out of date. Run 'make api-client' and commit the result." && exit 1)
      - uses: pnpm/action-setup@v4
        if: steps.mod.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.mod.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        if: steps.mod.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        if: steps.mod.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Go tests (with the Firestore emulator)
        if: steps.mod.outputs.present == 'true'
        run: pnpm exec firebase emulators:exec --only firestore --project demo-voyagami "cd services/api && REQUIRE_EMULATOR=1 go test ./..."
      - name: Container image builds
        if: steps.mod.outputs.present == 'true'
        run: docker build services/api

  rules:
    name: Firestore rules on the emulator
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for rules tests
        id: rules
        run: |
          if [ -f firebase.json ] && [ -f firestore.rules ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No firebase.json or firestore.rules yet (VOY-97); skipping rules tests."; fi
      - uses: pnpm/action-setup@v4
        if: steps.rules.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.rules.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        if: steps.rules.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        if: steps.rules.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run rules tests
        if: steps.rules.outputs.present == 'true'
        run: pnpm exec firebase emulators:exec --only firestore --project demo-voyagami "pnpm --filter @voyagami/rules-tests run test:emulator"

  # The single required status check. It always runs, so path filters never
  # leave a required check pending, and it fails if any needed job failed.
  ci:
    name: CI
    if: always()
    needs: [changes, mobile, api, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
